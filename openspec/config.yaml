schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# spec-check enforces the proposal rule below: openspec/spec-check.yaml says
# `decisions-first: enforce`, so `spec-check check` fails a proposal that does
# not open with a Decisions section.
rules:
  proposal:
    - "Open with a Decisions section listing the decisions the reviewer is asked to approve. Where a decision turned down a real alternative, name it and say why; do not make one up. Then list the questions this change leaves for later. Then everything else."
