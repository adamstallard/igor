\* VoidFailed = FALSE: an Igor whose probe-row append failed takes no item but leaves
\* the row, which may have landed, unvoided
\* (design.md, the table under *Decision*). TLC must find a violation of
\* HeldOnlyByItsProbe here, which shows that rule is needed.
SPECIFICATION Spec
VIEW StateView
SYMMETRY Symmetry
CONSTANTS
    First = {a1, a2}
    Second = {b1}
    NItems = 1
    MaxLosses = 1
    MaxLate = 0
    MaxStale = 0
    MaxCrashes = 0
    MaxClaimLosses = 0
    MaxRounds = 0
    MaxNothing = 0
    Reread = TRUE
    Settle = TRUE
    OldestDecides = TRUE
    VoidById = TRUE
    VoidLoser = TRUE
    FailedTakesNone = TRUE
    VoidFailed = FALSE
INVARIANT TypeOK
INVARIANT HeldOnlyByItsProbe
