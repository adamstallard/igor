\* VoidById = FALSE: a void row ends every probe row naming its item, as #226's fix
\* had it
\* (design.md, the table under *Decision*). TLC must find a violation of
\* ExactlyOneProbe here, which shows that rule is needed.
SPECIFICATION Spec
VIEW StateView
SYMMETRY Symmetry
CONSTANTS
    First = {a1, a2}
    Second = {b1}
    NItems = 1
    MaxLosses = 0
    MaxLate = 0
    MaxStale = 0
    MaxCrashes = 0
    MaxClaimLosses = 0
    MaxRounds = 0
    MaxNothing = 0
    Reread = TRUE
    Settle = TRUE
    OldestDecides = TRUE
    VoidById = FALSE
    VoidLoser = TRUE
    FailedTakesNone = TRUE
    VoidFailed = TRUE
INVARIANT TypeOK
INVARIANT ExactlyOneProbe
