\* OldestDecides = FALSE: the newest probe row decides, as `probeRunning` on main has it
\* (design.md, the table under *Decision*). TLC must find a violation of
\* ExactlyOneProbe here, which shows that rule is needed.
SPECIFICATION Spec
VIEW StateView
SYMMETRY Symmetry
CONSTANTS
    First = {a1, a2}
    Second = {b1}
    NItems = 1
    MaxLosses = 0
    MaxLate = 0
    MaxStale = 1
    MaxCrashes = 0
    MaxClaimLosses = 0
    MaxRounds = 0
    MaxNothing = 0
    Reread = TRUE
    Settle = TRUE
    OldestDecides = FALSE
    VoidById = TRUE
    VoidLoser = TRUE
    FailedTakesNone = TRUE
    VoidFailed = TRUE
INVARIANT TypeOK
INVARIANT ExactlyOneProbe
