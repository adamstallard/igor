\* VoidLoser = FALSE: an Igor whose row does not decide leaves it unvoided
\* (design.md, the table under *Decision*). TLC must find a violation of
\* HeldOnlyByItsProbe here, which shows that rule is needed.
SPECIFICATION Spec
VIEW StateView
SYMMETRY Symmetry
CONSTANTS
    First = {a1, a2}
    Second = {b1}
    NItems = 1
    MaxLosses = 0
    MaxLate = 0
    MaxStale = 0
    MaxCrashes = 0
    MaxClaimLosses = 0
    MaxRounds = 0
    MaxNothing = 1
    Reread = TRUE
    Settle = TRUE
    OldestDecides = TRUE
    VoidById = TRUE
    VoidLoser = FALSE
    FailedTakesNone = TRUE
    VoidFailed = TRUE
INVARIANT TypeOK
INVARIANT HeldOnlyByItsProbe
