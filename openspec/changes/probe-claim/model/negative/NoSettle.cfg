\* Settle = FALSE: an Igor re-reads as soon as its row lands, with an append still
\* in flight that may land ahead of it
\* (design.md, the table under *Decision*). TLC must find a violation of
\* ExactlyOneProbe here, which shows that rule is needed.
SPECIFICATION Spec
VIEW StateView
SYMMETRY Symmetry
CONSTANTS
    First = {a1, a2}
    Second = {b1}
    NItems = 1
    MaxLosses = 0
    MaxLate = 1
    MaxStale = 0
    MaxCrashes = 0
    MaxClaimLosses = 0
    MaxRounds = 0
    MaxNothing = 0
    Reread = TRUE
    Settle = FALSE
    OldestDecides = TRUE
    VoidById = TRUE
    VoidLoser = TRUE
    FailedTakesNone = TRUE
    VoidFailed = TRUE
INVARIANT TypeOK
INVARIANT ExactlyOneProbe
