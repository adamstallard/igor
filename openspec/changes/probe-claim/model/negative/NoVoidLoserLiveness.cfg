\* VoidLoser = FALSE, checked for liveness: the loser's row holds the scope for
\* good once the winner's probe observes nothing, and no Igor ever probes again.
\* TLC must find a violation of DueProbed here, which shows DueProbed is not met
\* vacuously. The held scope is a state where no step is possible. With the
\* deadlock check on, TLC would report a deadlock there, an exit code the
\* workflow does not accept, so the check is off and DueProbed reports it.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    First = {a1}
    Second = {b1}
    NItems = 1
    MaxLosses = 0
    MaxLate = 0
    MaxStale = 0
    MaxCrashes = 0
    MaxClaimLosses = 0
    MaxRounds = 0
    MaxNothing = 1
    Reread = TRUE
    Settle = TRUE
    OldestDecides = TRUE
    VoidById = TRUE
    VoidLoser = FALSE
    FailedTakesNone = TRUE
    VoidFailed = TRUE
INVARIANT TypeOK
PROPERTY DueProbed
CHECK_DEADLOCK FALSE
