\* The change as specified, checking that a due probe is taken (DueProbed). Liveness
\* with one process each of two roles, a late append, a lost claim and a probe
\* whose run observes nothing.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    First = {a1}
    Second = {b1}
    NItems = 1
    MaxLosses = 0
    MaxLate = 1
    MaxStale = 0
    MaxCrashes = 0
    MaxClaimLosses = 1
    MaxRounds = 0
    MaxNothing = 1
    Reread = TRUE
    Settle = TRUE
    OldestDecides = TRUE
    VoidById = TRUE
    VoidLoser = TRUE
    FailedTakesNone = TRUE
    VoidFailed = TRUE
INVARIANT TypeOK
PROPERTY DueProbed
