\* The change as specified, checking that a due probe is taken (DueProbed). It
\* runs without symmetry, which TLC can make miss a liveness violation, so it
\* checks two Igors to keep the model small: two processes of one role, with a
\* stale re-read and a crash left to lapse.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    First = {a1, a2}
    Second = {}
    NItems = 1
    MaxLosses = 0
    MaxLate = 0
    MaxStale = 1
    MaxCrashes = 1
    MaxClaimLosses = 0
    MaxRounds = 0
    MaxNothing = 0
    Reread = TRUE
    Settle = TRUE
    OldestDecides = TRUE
    VoidById = TRUE
    VoidLoser = TRUE
    FailedTakesNone = TRUE
    VoidFailed = TRUE
INVARIANT TypeOK
PROPERTY DueProbed
