\* The change as specified, checking that a due probe is taken (DueProbed). Liveness
\* with three Igors and a lost append.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    First = {a1, a2}
    Second = {b1}
    NItems = 1
    MaxLosses = 1
    MaxLate = 0
    MaxStale = 0
    MaxCrashes = 0
    MaxClaimLosses = 0
    MaxRounds = 0
    MaxNothing = 0
    Reread = TRUE
    Settle = TRUE
    OldestDecides = TRUE
    VoidById = TRUE
    VoidLoser = TRUE
    FailedTakesNone = TRUE
    VoidFailed = TRUE
INVARIANT TypeOK
PROPERTY DueProbed
