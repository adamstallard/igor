\* The change as specified, checking that a due probe is taken (DueProbed). Liveness
\* with one process each of two roles, a lost append, and a probe that meets
\* the condition again.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    First = {a1}
    Second = {b1}
    NItems = 1
    MaxLosses = 1
    MaxLate = 0
    MaxStale = 0
    MaxCrashes = 0
    MaxClaimLosses = 0
    MaxRounds = 1
    MaxNothing = 0
    Reread = TRUE
    Settle = TRUE
    OldestDecides = TRUE
    VoidById = TRUE
    VoidLoser = TRUE
    FailedTakesNone = TRUE
    VoidFailed = TRUE
INVARIANT TypeOK
PROPERTY DueProbed
