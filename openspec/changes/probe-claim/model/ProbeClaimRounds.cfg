\* The change as specified: every rule constant TRUE. Safety, with two processes
\* of one role and one of another on one seat.
\* Through a probe that meets the condition again, starting a second cooldown,
\* and one whose run observes nothing.
SPECIFICATION Spec
VIEW StateView
SYMMETRY Symmetry
CONSTANTS
    First = {a1, a2}
    Second = {b1}
    NItems = 1
    MaxLosses = 0
    MaxLate = 0
    MaxStale = 0
    MaxCrashes = 0
    MaxClaimLosses = 0
    MaxRounds = 1
    MaxNothing = 1
    Reread = TRUE
    Settle = TRUE
    OldestDecides = TRUE
    VoidById = TRUE
    VoidLoser = TRUE
    FailedTakesNone = TRUE
    VoidFailed = TRUE
INVARIANT TypeOK
INVARIANT ExactlyOneProbe
INVARIANT HeldOnlyByItsProbe
