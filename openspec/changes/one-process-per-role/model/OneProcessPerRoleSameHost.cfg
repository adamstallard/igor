\* p1 serves on host h1; p2 may start from the same lore checkout (one lock
\* directory), as a restart or as a second process started by mistake. Either
\* may crash, restart, pause or lose writes.
\* 3 starts in all, counting p1's at the outset; one pause in all; no loss of the record.
\* InitRecord and StaleDir are unused: p1 serves at the outset.
CONSTANTS
    Procs = {"p1", "p2"}
    Items = {"i1", "i2"}
    Half = 1
    StandDown = 4
    Watch = 6
    MaxStarts = 3
    MaxPauses = 1
    MaxLosses = 0
    TakeLock = TRUE
    WatchFirst = TRUE
    ConditionalWrites = TRUE
    StandDownTimer = TRUE
    AdoptClaims = TRUE
    LockDirOf <- OneHost
    InitServing = TRUE
    InitRecord = "none"
    StaleDir = "h0"
SPECIFICATION Spec
INVARIANTS TypeOK OneProcessWorks EveryClaimAccountedFor
CHECK_DEADLOCK FALSE
