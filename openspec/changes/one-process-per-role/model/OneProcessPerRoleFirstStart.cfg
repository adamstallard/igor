\* Nothing serves and no record exists: the role's first start, or a lost state
\* branch. Both processes may start, on two hosts, at the same moment.
\* 3 starts in all; one pause in all; no loss of the record.
CONSTANTS
    Procs = {"p1", "p2"}
    Items = {"i1", "i2"}
    WritePeriod = 1
    StandDown = 4
    Watch = 6
    MaxStarts = 3
    MaxPauses = 1
    MaxLosses = 0
    TakeLock = TRUE
    WatchFirst = TRUE
    ConditionalWrites = TRUE
    StandDownTimer = TRUE
    AdoptClaims = TRUE
    PollOf <- EqualPoll
    LockDirOf <- TwoHosts
    InitServing = FALSE
    InitRecord = "none"
    StaleDir = "h0"
SPECIFICATION Spec
INVARIANTS TypeOK OneProcessWorks EveryClaimAccountedFor
CHECK_DEADLOCK FALSE
