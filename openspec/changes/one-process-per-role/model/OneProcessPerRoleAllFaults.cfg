\* p1 serves on host h1; p2 may start on host h2. Up to four starts in all,
\* with a pause, a lost record, crashes and lost writes together.
\* 4 starts in all, counting p1's at the outset; one pause in all; one loss of the record.
\* InitRecord and StaleDir are unused: p1 serves at the outset.
CONSTANTS
    Procs = {"p1", "p2"}
    Items = {"i1", "i2"}
    Half = 1
    StandDown = 4
    Watch = 6
    MaxStarts = 4
    MaxPauses = 1
    MaxLosses = 1
    TakeLock = TRUE
    WatchFirst = TRUE
    ConditionalWrites = TRUE
    StandDownTimer = TRUE
    AdoptClaims = TRUE
    LockDirOf <- TwoHosts
    InitServing = TRUE
    InitRecord = "none"
    StaleDir = "h0"
SPECIFICATION Spec
INVARIANTS TypeOK OneProcessWorks EveryClaimAccountedFor
CHECK_DEADLOCK FALSE
