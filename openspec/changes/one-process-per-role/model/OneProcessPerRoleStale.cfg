\* Nothing serves; a process that crashed on host h1 left the record and its
\* claims. p1, standing for the crashed process, may start again
\* on h1, while p2 may start on h2.
\* 3 starts in all; one pause in all; no loss of the record.
CONSTANTS
    Procs = {"p1", "p2"}
    Items = {"i1", "i2"}
    Half = 1
    StandDown = 4
    Watch = 6
    MaxStarts = 3
    MaxPauses = 1
    MaxLosses = 0
    TakeLock = TRUE
    WatchFirst = TRUE
    ConditionalWrites = TRUE
    StandDownTimer = TRUE
    AdoptClaims = TRUE
    LockDirOf <- TwoHosts
    InitServing = FALSE
    InitRecord = "stale"
    StaleDir = "h1"
SPECIFICATION Spec
INVARIANTS TypeOK OneProcessWorks EveryClaimAccountedFor
CHECK_DEADLOCK FALSE
