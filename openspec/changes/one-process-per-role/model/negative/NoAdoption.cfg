\* Adoption removed: the process taking over leaves its predecessor's claims
\* unaccounted for. Must violate EveryClaimAccountedFor.
\* 3 starts in all; no pause; no loss of the record.
CONSTANTS
    Procs = {"p1", "p2"}
    Items = {"i1", "i2"}
    Half = 1
    StandDown = 4
    Watch = 6
    MaxStarts = 3
    MaxPauses = 0
    MaxLosses = 0
    TakeLock = TRUE
    WatchFirst = TRUE
    ConditionalWrites = TRUE
    StandDownTimer = TRUE
    AdoptClaims = FALSE
    LockDirOf <- OneHost
    InitServing = FALSE
    InitRecord = "stale"
    StaleDir = "h1"
SPECIFICATION Spec
INVARIANTS TypeOK OneProcessWorks EveryClaimAccountedFor
CHECK_DEADLOCK FALSE
