\* Stand-down at 30 minutes, equal to the watch: the process taking over can
\* start serving before the old one stops. Must violate OneProcessWorks.
\* 3 starts in all, counting p1's at the outset; no pause; no loss of the record.
\* InitRecord and StaleDir are unused: p1 serves at the outset.
CONSTANTS
    Procs = {"p1", "p2"}
    Items = {"i1", "i2"}
    WritePeriod = 1
    StandDown = 6
    Watch = 6
    MaxStarts = 3
    MaxPauses = 0
    MaxLosses = 0
    TakeLock = TRUE
    WatchFirst = TRUE
    ConditionalWrites = TRUE
    StandDownTimer = TRUE
    AdoptClaims = TRUE
    PollOf <- EqualPoll
    LockDirOf <- TwoHosts
    InitServing = TRUE
    InitRecord = "none"
    StaleDir = "h0"
SPECIFICATION Spec
INVARIANTS TypeOK OneProcessWorks EveryClaimAccountedFor
CHECK_DEADLOCK FALSE
