\* Record writes made unconditional: two processes starting together both take
\* over. Must violate OneProcessWorks.
\* 3 starts in all; no pause; no loss of the record.
CONSTANTS
    Procs = {"p1", "p2"}
    Items = {"i1", "i2"}
    WritePeriod = 1
    StandDown = 4
    Watch = 6
    MaxStarts = 3
    MaxPauses = 0
    MaxLosses = 0
    TakeLock = TRUE
    WatchFirst = TRUE
    ConditionalWrites = FALSE
    StandDownTimer = TRUE
    AdoptClaims = TRUE
    PollOf <- EqualPoll
    LockDirOf <- TwoHosts
    InitServing = FALSE
    InitRecord = "none"
    StaleDir = "h0"
SPECIFICATION Spec
INVARIANTS TypeOK OneProcessWorks EveryClaimAccountedFor
CHECK_DEADLOCK FALSE
