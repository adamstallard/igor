\* p1 serves on h1 with a poll interval three times p2's; the record is lost
\* once. Must violate OneProcessWorks.
CONSTANTS
    Procs = {"p1", "p2"}
    Items = {"i1", "i2"}
    HalfOf <- Slow3
    StandDown = 4
    Watch = 6
    MaxStarts = 3
    MaxPauses = 0
    MaxLosses = 1
    TakeLock = TRUE
    WatchFirst = TRUE
    ConditionalWrites = TRUE
    StandDownTimer = TRUE
    AdoptClaims = TRUE
    LockDirOf <- TwoHosts
    InitServing = TRUE
    InitRecord = "none"
    StaleDir = "h0"
SPECIFICATION Spec
INVARIANTS TypeOK OneProcessWorks EveryClaimAccountedFor
CHECK_DEADLOCK FALSE
