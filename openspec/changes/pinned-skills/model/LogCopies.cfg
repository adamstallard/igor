\* The change as specified: four executions of one item, on two hosts.
CONSTANTS
    Execs = 4
    Hosts = {h1, h2}
    StartedBefore = TRUE
    FinishedOnly = TRUE
    StoppedCounts = TRUE
    FlagCheck = TRUE
