\* The change as specified: five executions of one item, all on one host, so
\* every end may delete any other execution's copies.
CONSTANTS
    Execs = 5
    Hosts = {h1}
    StartedBefore = TRUE
    FinishedOnly = TRUE
    StoppedCounts = TRUE
    FlagCheck = TRUE
    HoldAtEnd = TRUE
SPECIFICATION Spec
\* Every execution ends or stops, so a final state has no next step; that
\* is the item at rest, not a deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoCopyDeletedWhileRunning
    FlaggedCopiesWaitForRelease
    LatestCopiesKept
    NoStaleCopies
