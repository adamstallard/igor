\* With this rule off, an end deletes the copies of an execution that left
\* a flagged hold.
CONSTANTS
    Execs = 3
    Hosts = {h1}
    StartedBefore = TRUE
    FinishedOnly = TRUE
    StoppedCounts = TRUE
    FlagCheck = FALSE
    HoldAtEnd = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT FlaggedCopiesWaitForRelease
