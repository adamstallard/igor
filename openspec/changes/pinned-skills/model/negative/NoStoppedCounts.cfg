\* With this rule off, an execution whose process stopped never counts as
\* finished, so its copies outlive the next execution's end.
CONSTANTS
    Execs = 3
    Hosts = {h1}
    StartedBefore = TRUE
    FinishedOnly = TRUE
    StoppedCounts = FALSE
    FlagCheck = TRUE
    HoldAtEnd = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT NoStaleCopies
