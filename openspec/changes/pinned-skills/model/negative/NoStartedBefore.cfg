\* With this rule off, an end deletes the copies of a finished execution
\* that started after it, so the latest execution loses its copies.
CONSTANTS
    Execs = 3
    Hosts = {h1}
    StartedBefore = FALSE
    FinishedOnly = TRUE
    StoppedCounts = TRUE
    FlagCheck = TRUE
    HoldAtEnd = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT LatestCopiesKept
