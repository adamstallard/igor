\* With this rule off, a flagged execution counts as ended before its hold
\* is in place, so an end in between deletes its copies.
CONSTANTS
    Execs = 3
    Hosts = {h1}
    StartedBefore = TRUE
    FinishedOnly = TRUE
    StoppedCounts = TRUE
    FlagCheck = TRUE
    HoldAtEnd = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT FlaggedCopiesWaitForRelease
