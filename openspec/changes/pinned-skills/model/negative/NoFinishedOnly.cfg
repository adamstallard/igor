\* With this rule off, an end deletes the copies of an earlier execution
\* still running.
CONSTANTS
    Execs = 3
    Hosts = {h1}
    StartedBefore = TRUE
    FinishedOnly = FALSE
    StoppedCounts = TRUE
    FlagCheck = TRUE
    HoldAtEnd = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT NoCopyDeletedWhileRunning
