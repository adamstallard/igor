\* Liveness, two ranks contending for one item that fails the same way
\* before the worker on every run, with one lost row and one claim-window
\* failure. A run that loses verification to its sibling counts nothing, so
\* each counted failure may cost two runs. The item needs three counted
\* failures, one more for the lost row and one more for a claim-window failure
\* beside the sibling's claim, which counts nothing: 2 x (3 + 1 + 1) = 10.
SPECIFICATION Spec
CONSTANTS
    NRanks = 2
    NItems = 1
    Sigs = {"a", "b"}
    SurfaceSigs = {"t"}
    \* Empty: every item fails with its own signature (DetSig), so no two runs
    \* can pair, and a refused call would act here as any other signature does.
    RefusalSigs = {}
    MaxRuns = 10
    MaxLosses = 1
    MaxLifts = 0
    MaxOtherPosts = 0
    MaxWindowFails = 1
    Returned = FALSE
    Cures = FALSE
    Reorder = TRUE
    Det = TRUE
    HolderOnly = TRUE
    AloneInWindow = TRUE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    AtomicWithdraw = TRUE
    PromptRows = TRUE
    SetDownOnce = TRUE
    IgorPostsLiftNothing = TRUE
    RefusalsUnpaired = TRUE
INVARIANT TypeOK
INVARIANT NoSetDownByNonHolder
INVARIANT NoSetDownWithoutThree
INVARIANT NoSetDownWithoutThreeInARow
INVARIANT NoDoubleSetDown
INVARIANT NoSetDownWithoutAnswer
PROPERTY RepeatedFailureSetDown
