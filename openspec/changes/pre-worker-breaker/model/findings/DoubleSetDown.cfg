\* A finding for Adam, not a rule turned off: CI does not run this file.
\* The change as specified. Two ranks read an item as free. One claims it,
\* fails a third time and sets it down, which releases it. The other's claim then lands on the
\* released item, holds it, fails the same way and sets it down again. TLC
\* finds NoDoubleSetDown violated. With SetDownOnce = TRUE, the rule proposed
\* for it, this configuration passes.
SPECIFICATION Spec
CONSTANTS
    NRanks = 2
    NItems = 2
    Sigs = {"a", "b"}
    SurfaceSigs = {"t"}
    MaxRuns = 5
    MaxLosses = 0
    MaxLifts = 0
    MaxWindowFails = 1
    Returned = FALSE
    Cures = FALSE
    Reorder = FALSE
    Det = FALSE
    HolderOnly = TRUE
    AloneInWindow = TRUE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    AtomicWithdraw = TRUE
    PromptRows = TRUE
    SetDownOnce = FALSE
INVARIANT TypeOK
INVARIANT NoDoubleSetDown
