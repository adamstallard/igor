\* The change as specified, with rows that land late or are lost. The
\* change accepts what this shows as a known limit, and the file is kept to
\* show it. CI does not run it: it fails by design. The cost is an item set
\* down early, which a person's change to the item lifts (the proposal's
\* decision 19). A row that has not landed when the next run of its item
\* counts is missing from the count: a different failure or a worker start no
\* longer breaks the sequence, and an outage row no longer excludes. TLC
\* finds NoSetDownWithoutThreeInARow violated.
SPECIFICATION Spec
CONSTANTS
    NItems = 2
    Sigs = {"a"}
    RefusalSigs = {"b"}
    SurfaceSigs = {"t"}
    MaxRuns = 5
    MaxDirected = 0
    MaxLosses = 1
    MaxLifts = 0
    MaxOtherPosts = 0
    MaxWindowFails = 1
    Returned = FALSE
    Cures = FALSE
    Reorder = TRUE
    Det = FALSE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    PromptRows = FALSE
    SetDownOnce = TRUE
    IgorPostsLiftNothing = TRUE
    RefusalsUnpaired = TRUE
INVARIANT TypeOK
INVARIANT NoSetDownWithoutThreeInARow
