\* A finding for Adam, not a rule turned off: CI does not run this file.
\* The change as specified, with rows that land late or are lost. A row
\* that has not landed when the next run of its item counts is missing from
\* the count: a different failure or a worker start no longer breaks the
\* sequence, and an outage row no longer excludes. TLC finds
\* NoSetDownWithoutThreeInARow violated.
SPECIFICATION Spec
CONSTANTS
    NRanks = 2
    NItems = 2
    Sigs = {"a", "b"}
    SurfaceSigs = {"t"}
    MaxRuns = 5
    MaxLosses = 1
    MaxLifts = 0
    MaxWindowFails = 1
    Returned = FALSE
    Cures = FALSE
    Reorder = TRUE
    Det = FALSE
    HolderOnly = TRUE
    AloneInWindow = TRUE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    AtomicWithdraw = TRUE
    PromptRows = FALSE
    SetDownOnce = FALSE
INVARIANT TypeOK
INVARIANT NoSetDownWithoutThreeInARow
