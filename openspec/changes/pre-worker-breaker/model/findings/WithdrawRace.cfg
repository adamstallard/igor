\* A finding for Adam, not a rule turned off: CI does not run this file.
\* The change as specified, with a lone claim-window rank's test of the item's
\* claim messages and its withdrawal as two tracker calls. A sibling's claim
\* message lands and verifies between them, and the withdrawal releases the
\* item under it; the sibling, still working, later sets the item down while
\* no claim message of its counts. TLC finds NoSetDownByNonHolder violated.
SPECIFICATION Spec
CONSTANTS
    NRanks = 2
    NItems = 2
    Sigs = {"a", "b"}
    SurfaceSigs = {"t"}
    MaxRuns = 5
    MaxLosses = 0
    MaxLifts = 0
    MaxWindowFails = 1
    Returned = FALSE
    Cures = FALSE
    Reorder = FALSE
    Det = FALSE
    HolderOnly = TRUE
    AloneInWindow = TRUE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    AtomicWithdraw = FALSE
    PromptRows = TRUE
    SetDownOnce = FALSE
INVARIANT TypeOK
INVARIANT NoSetDownByNonHolder
