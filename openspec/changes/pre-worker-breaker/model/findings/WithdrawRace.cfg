\* Why the AtomicWithdraw assumption is needed: the race #179's mechanism must
\* prevent. CI does not run this file: it
\* fails by design. Adam decided (2026-10-20) that the withdrawal releases
\* only claim messages posted before the rank's test, and #179 decides how.
\* The model assumes that mechanism as AtomicWithdraw. This file drops it: a
\* lone claim-window rank's test of the item's claim messages and its
\* withdrawal are two tracker calls, and the withdrawal releases every claim
\* message. A sibling's claim
\* message lands and verifies between them, and the withdrawal releases the
\* item under it; the sibling, still working, later sets the item down while
\* no claim message of its counts. TLC finds NoSetDownByNonHolder violated.
SPECIFICATION Spec
CONSTANTS
    NRanks = 2
    NItems = 2
    Sigs = {"a", "b"}
    SurfaceSigs = {"t"}
    MaxRuns = 5
    MaxLosses = 0
    MaxLifts = 0
    MaxOtherPosts = 0
    MaxWindowFails = 1
    Returned = FALSE
    Cures = FALSE
    Reorder = FALSE
    Det = FALSE
    HolderOnly = TRUE
    AloneInWindow = TRUE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    AtomicWithdraw = FALSE
    PromptRows = TRUE
    SetDownOnce = TRUE
    IgorPostsLiftNothing = TRUE
INVARIANT TypeOK
INVARIANT NoSetDownByNonHolder
