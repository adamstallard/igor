\* The change as specified without PromptRows: rows land late, in any
\* order, and one may be lost. NoSetDownWithoutThreeInARow can then fail, as
\* findings/LateRows.cfg shows, a known limit the change accepts; the
\* invariants checked here still hold.
SPECIFICATION Spec
CONSTANTS
    NItems = 2
    Sigs = {"a"}
    RefusalSigs = {"b"}
    SurfaceSigs = {"t"}
    MaxRuns = 4
    MaxDirected = 0
    MaxLosses = 1
    MaxLifts = 0
    MaxOtherPosts = 0
    MaxWindowFails = 1
    Returned = FALSE
    Cures = FALSE
    Reorder = TRUE
    Det = FALSE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    PromptRows = FALSE
    SetDownOnce = TRUE
    IgorPostsLiftNothing = TRUE
    RefusalsUnpaired = TRUE
INVARIANT TypeOK
INVARIANT NoSetDownWithoutThree
INVARIANT NoDoubleSetDown
INVARIANT NoSetDownWithoutAnswer
INVARIANT NoCycleEndOnRefusal
