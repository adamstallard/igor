\* The change as specified without PromptRows: rows land late, in any
\* order, and one may be lost. NoSetDownWithoutThreeInARow can then fail, as
\* findings/LateRows.cfg shows, a limit Adam accepted; the invariants checked
\* here still hold.
SPECIFICATION Spec
CONSTANTS
    NRanks = 2
    NItems = 2
    Sigs = {"a", "b"}
    SurfaceSigs = {"t"}
    MaxRuns = 4
    MaxLosses = 1
    MaxLifts = 0
    MaxOtherPosts = 0
    MaxWindowFails = 1
    Returned = FALSE
    Cures = FALSE
    Reorder = TRUE
    Det = FALSE
    HolderOnly = TRUE
    AloneInWindow = TRUE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    AtomicWithdraw = TRUE
    PromptRows = FALSE
    SetDownOnce = TRUE
    IgorPostsLiftNothing = TRUE
INVARIANT TypeOK
INVARIANT NoSetDownByNonHolder
INVARIANT NoSetDownWithoutThree
INVARIANT NoDoubleSetDown
INVARIANT NoSetDownWithoutAnswer
