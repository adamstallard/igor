\* IgorPostsLiftNothing = FALSE: another role's post on a deferred item, such
\* as its own set-down, lifts the set-down. One rank, one item failing the
\* same way: the item is set down, another role's post lifts it, and the next
\* identical failure sets it down again with no person's change or successful
\* run between. TLC must find NoSetDownWithoutAnswer violated.
\* PromptRows is TRUE, so no late row can cause the violation.
SPECIFICATION Spec
CONSTANTS
    NRanks = 1
    NItems = 1
    Sigs = {"a"}
    SurfaceSigs = {"t"}
    MaxRuns = 5
    MaxLosses = 0
    MaxLifts = 0
    MaxOtherPosts = 1
    MaxWindowFails = 0
    Returned = FALSE
    Cures = FALSE
    Reorder = FALSE
    Det = FALSE
    HolderOnly = TRUE
    AloneInWindow = TRUE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    AtomicWithdraw = TRUE
    PromptRows = TRUE
    SetDownOnce = TRUE
    IgorPostsLiftNothing = FALSE
INVARIANT TypeOK
INVARIANT NoSetDownWithoutAnswer
