\* CureSkipped = FALSE: a failure that records a cure key writes a
\* pre-worker row and counts. TLC must find NoSetDownForCure violated.
\* PromptRows is TRUE, so no late row can cause the violation.
SPECIFICATION Spec
CONSTANTS
    NRanks = 1
    NItems = 1
    Sigs = {"a", "b"}
    SurfaceSigs = {"t"}
    MaxRuns = 3
    MaxLosses = 0
    MaxLifts = 0
    MaxWindowFails = 0
    Returned = FALSE
    Cures = TRUE
    Reorder = FALSE
    Det = FALSE
    HolderOnly = TRUE
    AloneInWindow = TRUE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = FALSE
    AtomicWithdraw = TRUE
    PromptRows = TRUE
    SetDownOnce = FALSE
INVARIANT TypeOK
INVARIANT NoSetDownForCure
