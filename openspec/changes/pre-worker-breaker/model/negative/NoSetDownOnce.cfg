\* SetDownOnce = FALSE: a run may post a set-down on an item already
\* deferred. The item fails a third time and is set down; a directed run,
\* `igor run --claim`, then claims the deferred item, fails the same way and
\* sets it down again. TLC must find NoDoubleSetDown violated.
\* One item, one signature and no claim-window failure keep it small.
\* PromptRows is TRUE, so no late row can cause the violation.
SPECIFICATION Spec
CONSTANTS
    NItems = 1
    Sigs = {"a"}
    SurfaceSigs = {"t"}
    RefusalSigs = {}
    MaxRuns = 5
    MaxDirected = 1
    MaxLosses = 0
    MaxLifts = 0
    MaxOtherPosts = 0
    MaxWindowFails = 0
    Returned = FALSE
    Cures = FALSE
    Reorder = FALSE
    Det = FALSE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    PromptRows = TRUE
    SetDownOnce = FALSE
    IgorPostsLiftNothing = TRUE
    RefusalsUnpaired = TRUE
INVARIANT TypeOK
INVARIANT NoDoubleSetDown
