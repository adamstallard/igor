\* SetDownOnce = FALSE: a run may post a set-down on an item already
\* deferred. Two ranks read an item as free. One claims it, fails a third
\* time and sets it down, which releases it. The other's claim then lands on
\* the released item, holds it, fails the same way and sets it down again.
\* TLC must find NoDoubleSetDown violated.
\* One item, one signature and no claim-window failure keep it small.
\* PromptRows is TRUE, so no late row can cause the violation.
SPECIFICATION Spec
CONSTANTS
    NRanks = 2
    NItems = 1
    Sigs = {"a"}
    SurfaceSigs = {"t"}
    MaxRuns = 5
    MaxLosses = 0
    MaxLifts = 0
    MaxOtherPosts = 0
    MaxWindowFails = 0
    Returned = FALSE
    Cures = FALSE
    Reorder = FALSE
    Det = FALSE
    HolderOnly = TRUE
    AloneInWindow = TRUE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    AtomicWithdraw = TRUE
    PromptRows = TRUE
    SetDownOnce = FALSE
    IgorPostsLiftNothing = TRUE
INVARIANT TypeOK
INVARIANT NoDoubleSetDown
