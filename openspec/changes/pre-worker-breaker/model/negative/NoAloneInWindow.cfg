\* AloneInWindow = FALSE: a claim-window failure counts even beside another
\* rank's claim message. TLC must find NoSetDownByNonHolder violated.
\* PromptRows is TRUE, so no late row can cause the violation.
SPECIFICATION Spec
CONSTANTS
    NRanks = 2
    NItems = 2
    Sigs = {"a", "b"}
    SurfaceSigs = {"t"}
    MaxRuns = 4
    MaxLosses = 0
    MaxLifts = 0
    MaxWindowFails = 1
    Returned = FALSE
    Cures = FALSE
    Reorder = FALSE
    Det = FALSE
    HolderOnly = TRUE
    AloneInWindow = FALSE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    AtomicWithdraw = TRUE
    PromptRows = TRUE
    SetDownOnce = FALSE
INVARIANT TypeOK
INVARIANT NoSetDownByNonHolder
