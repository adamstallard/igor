    RefusalSigs = {}
    MaxRuns = 2
    MaxLosses = 0
    MaxLifts = 0
    MaxOtherPosts = 0
    MaxWindowFails = 0
    Returned = TRUE
    Cures = FALSE
    Reorder = FALSE
    Det = FALSE
    HolderOnly = TRUE
    AloneInWindow = TRUE
    IdenticalOnly = TRUE
    ReturnedRetried = FALSE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    AtomicWithdraw = TRUE
    PromptRows = TRUE
    SetDownOnce = TRUE
    IgorPostsLiftNothing = TRUE
    RefusalsUnpaired = TRUE
INVARIANT TypeOK
INVARIANT NoSetDownWithoutThree
