\* IdenticalOnly = FALSE: every failure before the worker counts toward its
\* item, whatever its signature. TLC must find NoSetDownWithoutThree violated.
\* PromptRows is TRUE, so no late row can cause the violation.
SPECIFICATION Spec
CONSTANTS
    NRanks = 1
    NItems = 1
    Sigs = {"a", "b"}
    SurfaceSigs = {"t"}
    MaxRuns = 3
    MaxLosses = 0
    MaxLifts = 0
    MaxWindowFails = 0
    Returned = FALSE
    Cures = FALSE
    Reorder = FALSE
    Det = FALSE
    HolderOnly = TRUE
    AloneInWindow = TRUE
    IdenticalOnly = FALSE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    AtomicWithdraw = TRUE
    PromptRows = TRUE
    SetDownOnce = FALSE
INVARIANT TypeOK
INVARIANT NoSetDownWithoutThree
