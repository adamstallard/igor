\* IdenticalOnly = FALSE: every failure before the worker counts toward its
\* item, whatever its signature. TLC must find NoSetDownWithoutThree violated.
\* PromptRows is TRUE, so no late row can cause the violation.
SPECIFICATION Spec
CONSTANTS
    NItems = 1
    Sigs = {"a", "b"}
    SurfaceSigs = {"t"}
    RefusalSigs = {}
    MaxRuns = 3
    MaxDirected = 0
    MaxLosses = 0
    MaxLifts = 0
    MaxOtherPosts = 0
    MaxWindowFails = 0
    Returned = FALSE
    Cures = FALSE
    Reorder = FALSE
    Det = FALSE
    IdenticalOnly = FALSE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    PromptRows = TRUE
    SetDownOnce = TRUE
    IgorPostsLiftNothing = TRUE
    RefusalsUnpaired = TRUE
INVARIANT TypeOK
INVARIANT NoSetDownWithoutThree
