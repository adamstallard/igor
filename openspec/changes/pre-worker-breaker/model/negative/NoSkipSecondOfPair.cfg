\* SkipSecondOfPair = FALSE: the run that ends its cycle as the second of a
\* pair counts toward its item. TLC must find NoSetDownWithoutThreeInARow
\* violated.
\* PromptRows is TRUE, so no late row can cause the violation.
SPECIFICATION Spec
CONSTANTS
    NRanks = 1
    NItems = 2
    Sigs = {"a", "b"}
    SurfaceSigs = {"t"}
    MaxRuns = 6
    MaxLosses = 0
    MaxLifts = 0
    MaxWindowFails = 0
    Returned = FALSE
    Cures = FALSE
    Reorder = FALSE
    Det = FALSE
    HolderOnly = TRUE
    AloneInWindow = TRUE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = FALSE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    AtomicWithdraw = TRUE
    PromptRows = TRUE
    SetDownOnce = FALSE
INVARIANT TypeOK
INVARIANT NoSetDownWithoutThreeInARow
