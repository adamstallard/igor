    MaxLifts = 0
    MaxOtherPosts = 0
    MaxWindowFails = 0
    Returned = FALSE
    Cures = FALSE
    Reorder = FALSE
    Det = FALSE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = FALSE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    PromptRows = TRUE
    SetDownOnce = TRUE
    IgorPostsLiftNothing = TRUE
    RefusalsUnpaired = TRUE
INVARIANT TypeOK
INVARIANT NoSetDownWithoutThreeInARow
