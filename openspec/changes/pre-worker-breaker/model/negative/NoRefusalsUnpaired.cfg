\* RefusalsUnpaired = FALSE: a refused call can be one of a pair, so two
\* identical refused calls on different items end the cycle. TLC must find
\* NoCycleEndOnRefusal violated. PromptRows is TRUE, so no late row can cause
\* the violation.
SPECIFICATION Spec
CONSTANTS
    NItems = 2
    Sigs = {}
    SurfaceSigs = {"t"}
    RefusalSigs = {"r"}
    MaxRuns = 2
    MaxDirected = 0
    MaxLosses = 0
    MaxLifts = 0
    MaxOtherPosts = 0
    MaxWindowFails = 0
    Returned = FALSE
    Cures = FALSE
    Reorder = FALSE
    Det = FALSE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    PromptRows = TRUE
    SetDownOnce = TRUE
    IgorPostsLiftNothing = TRUE
    RefusalsUnpaired = FALSE
INVARIANT TypeOK
INVARIANT NoCycleEndOnRefusal
