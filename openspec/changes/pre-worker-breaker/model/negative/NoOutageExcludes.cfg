\* OutageExcludes = FALSE: an outage row excludes nothing, so a pair's
\* failures count. TLC must find NoSetDownWithoutThreeInARow violated.
\* PromptRows is TRUE, so no late row can cause the violation.
SPECIFICATION Spec
CONSTANTS
    NRanks = 1
    NItems = 2
    Sigs = {"a", "b"}
    SurfaceSigs = {"t"}
    RefusalSigs = {}
    MaxRuns = 5
    MaxLosses = 0
    MaxLifts = 0
    MaxOtherPosts = 0
    MaxWindowFails = 0
    Returned = FALSE
    Cures = FALSE
    Reorder = FALSE
    Det = FALSE
    HolderOnly = TRUE
    AloneInWindow = TRUE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = FALSE
    CureSkipped = TRUE
    AtomicWithdraw = TRUE
    PromptRows = TRUE
    SetDownOnce = TRUE
    IgorPostsLiftNothing = TRUE
    RefusalsUnpaired = TRUE
INVARIANT TypeOK
INVARIANT NoSetDownWithoutThreeInARow
