\* Liveness: two items, each failing the same way before the worker on every
\* run, with one lost row and one claim-window failure. A claim-window
\* failure counts like any other, so each item is set down within three runs
\* of its own, plus one for the lost row (MaxRuns 7).
SPECIFICATION Spec
CONSTANTS
    NItems = 2
    Sigs = {"a", "b"}
    SurfaceSigs = {"t"}
    \* Empty: every item fails with its own signature (DetSig), so no two runs
    \* can pair, and a refused call would act here as any other signature does.
    RefusalSigs = {}
    MaxRuns = 7
    MaxDirected = 0
    MaxLosses = 1
    MaxLifts = 0
    MaxOtherPosts = 0
    MaxWindowFails = 1
    Returned = FALSE
    Cures = FALSE
    Reorder = TRUE
    Det = TRUE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    PromptRows = TRUE
    SetDownOnce = TRUE
    IgorPostsLiftNothing = TRUE
    RefusalsUnpaired = TRUE
INVARIANT TypeOK
INVARIANT NoSetDownWithoutThree
INVARIANT NoSetDownWithoutThreeInARow
INVARIANT NoDoubleSetDown
INVARIANT NoSetDownWithoutAnswer
PROPERTY RepeatedFailureSetDown
