\* The change as specified with two ranks. It differs from PreWorkerBreaker.cfg
\* by adding returned failures and failures that record a cure key, and, to
\* keep the state space small, by having no claim-window failure and four runs
\* instead of five. NoDoubleSetDown is not checked, as in PreWorkerBreaker.cfg.
SPECIFICATION Spec
CONSTANTS
    NRanks = 2
    NItems = 2
    Sigs = {"a", "b"}
    SurfaceSigs = {"t"}
    MaxRuns = 4
    MaxLosses = 0
    MaxLifts = 0
    MaxWindowFails = 0
    Returned = TRUE
    Cures = TRUE
    Reorder = FALSE
    Det = FALSE
    HolderOnly = TRUE
    AloneInWindow = TRUE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    AtomicWithdraw = TRUE
    PromptRows = TRUE
    SetDownOnce = FALSE
INVARIANT TypeOK
INVARIANT NoSetDownByNonHolder
INVARIANT NoSetDownWithoutThree
INVARIANT NoSetDownWithoutThreeInARow
INVARIANT NoSetDownForCure
