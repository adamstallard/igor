\* The change as specified with one rank and two items, adding to
\* PreWorkerBreaker.cfg returned failures, failures that record a cure key and
\* a lifted deferral. It checks every invariant.
SPECIFICATION Spec
CONSTANTS
    NRanks = 1
    NItems = 2
    Sigs = {"a", "b"}
    SurfaceSigs = {"t"}
    MaxRuns = 6
    MaxLosses = 0
    MaxLifts = 1
    MaxOtherPosts = 0
    MaxWindowFails = 1
    Returned = TRUE
    Cures = TRUE
    Reorder = FALSE
    Det = FALSE
    HolderOnly = TRUE
    AloneInWindow = TRUE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    AtomicWithdraw = TRUE
    PromptRows = TRUE
    SetDownOnce = TRUE
    IgorPostsLiftNothing = TRUE
INVARIANT TypeOK
INVARIANT NoSetDownByNonHolder
INVARIANT NoSetDownWithoutThree
INVARIANT NoSetDownWithoutThreeInARow
INVARIANT NoDoubleSetDown
INVARIANT NoSetDownForCure
INVARIANT NoSetDownWithoutAnswer
