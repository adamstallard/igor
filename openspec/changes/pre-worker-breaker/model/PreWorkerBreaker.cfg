\* The change as specified, every rule TRUE: one role's process, two items,
\* three signatures (a surface failure, a refused call and a failure of the
\* working tree), a failure in the claim window, a lifted deferral and one
\* directed run (`igor run --claim`). Rows land in the order they were
\* decided, and before the item's next claim (PromptRows). NoSetDownForCure
\* is not checked, since no failure here records a cure key.
SPECIFICATION Spec
CONSTANTS
    NItems = 2
    Sigs = {"a"}
    RefusalSigs = {"b"}
    SurfaceSigs = {"t"}
    MaxRuns = 7
    MaxDirected = 1
    MaxLosses = 0
    MaxLifts = 1
    MaxOtherPosts = 0
    MaxWindowFails = 1
    Returned = FALSE
    Cures = FALSE
    Reorder = FALSE
    Det = FALSE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    PromptRows = TRUE
    SetDownOnce = TRUE
    IgorPostsLiftNothing = TRUE
    RefusalsUnpaired = TRUE
INVARIANT TypeOK
INVARIANT NoSetDownWithoutThree
INVARIANT NoSetDownWithoutThreeInARow
INVARIANT NoDoubleSetDown
INVARIANT NoSetDownWithoutAnswer
INVARIANT NoCycleEndOnRefusal
