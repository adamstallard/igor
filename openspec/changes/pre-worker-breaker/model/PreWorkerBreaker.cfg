\* The change as specified, every rule TRUE: two ranks of one role, two items,
\* a surface signature and two others, and a failure in the claim window. Rows
\* land in the order they were decided, and before the item's next claim
\* (PromptRows). NoDoubleSetDown is not checked: findings/DoubleSetDown.cfg
\* shows that two ranks can each post a set-down. NoSetDownForCure is not
\* checked either, since no failure here records a cure key.
SPECIFICATION Spec
CONSTANTS
    NRanks = 2
    NItems = 2
    Sigs = {"a", "b"}
    SurfaceSigs = {"t"}
    MaxRuns = 5
    MaxLosses = 0
    MaxLifts = 0
    MaxWindowFails = 1
    Returned = FALSE
    Cures = FALSE
    Reorder = FALSE
    Det = FALSE
    HolderOnly = TRUE
    AloneInWindow = TRUE
    IdenticalOnly = TRUE
    ReturnedRetried = TRUE
    SkipSecondOfPair = TRUE
    OutageExcludes = TRUE
    CureSkipped = TRUE
    AtomicWithdraw = TRUE
    PromptRows = TRUE
    SetDownOnce = FALSE
INVARIANT TypeOK
INVARIANT NoSetDownByNonHolder
INVARIANT NoSetDownWithoutThree
INVARIANT NoSetDownWithoutThreeInARow
