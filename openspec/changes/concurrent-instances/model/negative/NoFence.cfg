\* Fence = FALSE turns off decision 19 in design.md, under *Each decision,
\* and what breaks without it* (the proposal's decision 23): a process that finds another process's id in
\* its own rank's heartbeat file stops for good. Rank 1 crashes or misses a
\* heartbeat, `igor run` starts, and rank 1 comes back, restarted or
\* resuming. Without the rule, the run and rank 1 both go on as rank 1, each
\* writing over the other's id. TLC must find a violation of
\* OneProcessPerRank here.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 2
    NItems = 1
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 1
    MaxLosses = 0
    MaxStops = 0
    MaxMisses = 1
    MaxHandovers = 0
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 0
    MaxRuns = 1
    MaxEdits = 0
    MaxFails = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
    TimerHalts = TRUE
    HolderReleases = TRUE
    HolderStops = TRUE
    Fence = FALSE
INVARIANT TypeOK
INVARIANT OneProcessPerRank
