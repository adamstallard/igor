\* HeartbeatFirst = FALSE turns off decision 2 in design.md, under *Each
\* decision, and what breaks without it*: the first heartbeat lands before the
\* first cycle. TLC must find a violation of NoTwoWorkers here, which shows
\* that decision is needed.
SPECIFICATION Spec
CONSTANTS
    NRanks = 2
    NItems = 2
    Roster = {1, 2}
    Bound = 3
    MaxCrashes = 1
    MaxLosses = 1
    MaxStops = 0
    MaxMisses = 0
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = FALSE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
