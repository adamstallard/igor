\* StandDownOnMisses = FALSE turns off decision 9 in design.md, under *Each
\* decision, and what breaks without it*: a process that cannot write its
\* heartbeat for two intervals stands down. TLC must find a violation of
\* LiveRankNeverGone here, which shows that decision is needed.
SPECIFICATION Spec
CONSTANTS
    NRanks = 2
    NItems = 2
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 0
    MaxLosses = 0
    MaxStops = 0
    MaxMisses = 3
    MaxHandovers = 0
    MaxRetires = 0
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = FALSE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    WaitAfterRelease = TRUE
    RosterWaits = TRUE
INVARIANT TypeOK
INVARIANT LiveRankNeverGone
