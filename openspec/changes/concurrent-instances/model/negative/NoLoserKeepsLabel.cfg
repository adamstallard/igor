\* LoserKeepsLabel = FALSE turns off decision 5 in design.md, under *Each
\* decision, and what breaks without it*: a process that loses to its own role
\* keeps the role's label on the item. TLC must find a violation of NoTwoWorkers
\* here, which shows that decision is needed.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 2
    NRuns = 0
    NItems = 2
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 1
    MaxLosses = 1
    MaxStops = 0
    MaxMisses = 0
    MaxHandovers = 0
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 0
    MaxPollChanges = 0
    StartLen = 1     \* poll interval every process starts on, in shorter intervals
    CeilLen = 1      \* maximum poll interval, in shorter intervals: the longest used here
    MissOnly = 0     \* any rank may miss heartbeats
    CrashOnly = 0    \* any rank may crash
    MaxEdits = 0
    MaxFails = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = FALSE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
    TimerHalts = TRUE
    HolderReleases = TRUE
    HolderStops = TRUE
    VerifyClaims = TRUE
    OwnerFirst = TRUE
    RunIds = TRUE
    SettleWithdraw = TRUE
    RereadKeepsLabel = TRUE
    DeclaredInterval = TRUE
    Ceiling = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
