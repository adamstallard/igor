\* CounterLiveness = FALSE turns off decision 14 in design.md, under *Each
\* decision, and what breaks without it*: liveness is judged by a counter in
\* the heartbeat file, never by the times in it. TLC must find a violation of
\* NoTwoWorkers here, which shows that decision is needed.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 2
    NItems = 1
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 0
    MaxLosses = 0
    MaxStops = 0
    MaxMisses = 0
    MaxHandovers = 0
    MaxRetires = 0
    MaxClockSteps = 1
    MaxPRs = 0
    MaxRuns = 0
    MaxEdits = 0
    MaxFails = 0
    CounterLiveness = FALSE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
    TimerHalts = TRUE
    HolderReleases = TRUE
    HolderStops = TRUE
    Fence = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
