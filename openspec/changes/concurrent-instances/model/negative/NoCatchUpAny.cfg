\* CatchUpAny = FALSE turns off decision 15 in design.md, under *Each decision,
\* and what breaks without it*: any process takes over a gone rank's claim on an
\* item whose pull request is open, and catches it up. TLC must find a
\* violation of OrphanRecovered here, which shows that decision is needed.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 2
    NRuns = 0
    NItems = 1
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 1
    MaxLosses = 0
    MaxStops = 0
    MaxMisses = 0
    MaxHandovers = 0
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 1
    MaxPollChanges = 0
    MaxEdits = 0
    MaxFails = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = FALSE
    CatchUpSupersedes = TRUE
    TimerHalts = TRUE
    HolderReleases = TRUE
    HolderStops = TRUE
    VerifyClaims = TRUE
    OwnerFirst = TRUE
    RunIds = TRUE
    SettleWithdraw = TRUE
    RereadKeepsLabel = TRUE
    DeclaredInterval = TRUE
INVARIANT TypeOK
PROPERTY OrphanRecovered
