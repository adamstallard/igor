\* StandDownAt = 2 with CheckpointGap = 2 turns off decision 13 in design.md,
\* under *Each decision, and what breaks without it*: where a worker may go two
\* intervals between checkpoints, a process stands down after one missed
\* heartbeat. TLC must find a violation of NoTwoWorkers here, which shows that
\* decision is needed.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 2
    NItems = 1
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 2
    MaxCrashes = 0
    MaxLosses = 0
    MaxStops = 0
    MaxMisses = 3
    MaxHandovers = 0
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
