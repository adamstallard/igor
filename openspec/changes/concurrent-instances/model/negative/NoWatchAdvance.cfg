\* WatchAdvance = FALSE turns off decision 8 in design.md, under *Each decision,
\* and what breaks without it*: a sibling is gone only once its heartbeat has
\* not moved forward for three polls. TLC must find a violation of
\* LiveRankNeverGone here, which shows that decision is needed.
SPECIFICATION Spec
CONSTANTS
    NRanks = 2
    NItems = 2
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 1
    MaxLosses = 1
    MaxStops = 0
    MaxMisses = 0
    MaxHandovers = 0
    MaxRetires = 0
    WatchAdvance = FALSE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    WaitAfterRelease = TRUE
    RosterWaits = TRUE
INVARIANT TypeOK
INVARIANT LiveRankNeverGone
