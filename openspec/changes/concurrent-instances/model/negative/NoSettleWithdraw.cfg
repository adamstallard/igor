\* SettleWithdraw = FALSE turns off decision 21 in design.md, under *Each
\* decision, and what breaks without it*: a process whose claim message
\* failed to post removes the label it set whenever its test finds no claim
\* message that counts, however long after it set the label. A sibling posts
\* after the test and verifies before the removal; the removal releases its
\* claim while it works, and the process claims the item again. TLC finds
\* NoTwoWorkers violated.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 2
    NRuns = 0
    NItems = 1
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 0
    MaxLosses = 0
    MaxStops = 0
    MaxMisses = 0
    MaxHandovers = 0
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 0
    MaxPollChanges = 0
    MaxEdits = 0
    MaxFails = 1
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
    TimerHalts = TRUE
    HolderReleases = TRUE
    HolderStops = TRUE
    VerifyClaims = TRUE
    OwnerFirst = TRUE
    RunIds = TRUE
    SettleWithdraw = FALSE
    RereadKeepsLabel = TRUE
    DeclaredInterval = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
