\* RunIds = FALSE turns off decision 20 in design.md, under *Each decision,
\* and what breaks without it*: an `igor run`'s claim message carries only
\* rank 0, not its run id. Two runs of one role at once each read the
\* earliest rank-0 message as their own claim, and both work the item. TLC
\* finds NoTwoWorkers violated.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 1
    NRuns = 2
    NItems = 1
    Roster = {1}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 0
    MaxLosses = 0
    MaxStops = 0
    MaxMisses = 0
    MaxHandovers = 0
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 0
    MaxPollChanges = 0
    MaxEdits = 0
    MaxFails = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
    TimerHalts = TRUE
    HolderReleases = TRUE
    HolderStops = TRUE
    VerifyClaims = TRUE
    OwnerFirst = TRUE
    RunIds = FALSE
    SettleWithdraw = TRUE
    RereadKeepsLabel = TRUE
    DeclaredInterval = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
