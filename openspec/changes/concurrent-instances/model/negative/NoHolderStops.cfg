\* HolderStops = FALSE turns off decision 18 in design.md, under *Each
\* decision, and what breaks without it*: only the rank whose claim message
\* holds a handed-over item answers a stop said on it. TLC must find a
\* violation of NoReceiptWhileWorked here, which shows that decision is needed.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 2
    NItems = 1
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 0
    MaxLosses = 0
    MaxStops = 1
    MaxMisses = 0
    MaxHandovers = 1
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 0
    MaxRuns = 0
    MaxEdits = 0
    MaxFails = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
    TimerHalts = TRUE
    HolderReleases = TRUE
    HolderStops = FALSE
    Fence = TRUE
INVARIANT TypeOK
INVARIANT NoReceiptWhileWorked
