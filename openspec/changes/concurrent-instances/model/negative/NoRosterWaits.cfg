\* RosterWaits = FALSE turns off decision 12 in design.md, under *Each decision,
\* and what breaks without it*: a rank removed from the roster is adopted only
\* once it is gone. TLC must find a violation of NoTwoWorkers here, which shows
\* that decision is needed.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 2
    NItems = 2
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 0
    MaxLosses = 0
    MaxStops = 0
    MaxMisses = 0
    MaxHandovers = 0
    MaxRetires = 1
    MaxClockSteps = 0
    MaxPRs = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = FALSE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
