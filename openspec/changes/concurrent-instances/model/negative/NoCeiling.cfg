\* Ceiling = FALSE turns off rule 24 in design.md, under *Each decision,
\* and what breaks without it*: a watcher holding no declaration from a
\* sibling counts in the longest of its own interval and what the
\* sibling's file says now, not in the maximum poll interval. Both ranks
\* start on the doubled interval and the head changes to the shorter one.
\* Rank A applies the change. Rank B works an item and stops writing
\* heartbeats before A has seen any write of B's, so A holds no declaration
\* from B. The state branch is lost, taking B's file, so A counts in its
\* own, shorter interval and counts B gone after three of them and takes the item over while the second, which stands down
\* only after four, still works it. TLC finds NoTwoWorkers violated.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 2
    NRuns = 0
    NItems = 1
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 0
    MaxLosses = 1
    MaxStops = 0
    MaxMisses = 3
    MaxHandovers = 0
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 0
    MaxPollChanges = 1
    StartLen = 2     \* every process starts on the doubled poll interval
    CeilLen = 2      \* maximum poll interval, in shorter intervals: the longest used here
    MissOnly = 0     \* any rank may miss heartbeats
    CrashOnly = 0    \* any rank may crash
    MaxEdits = 0
    MaxFails = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
    TimerHalts = TRUE
    HolderReleases = TRUE
    HolderStops = TRUE
    VerifyClaims = TRUE
    OwnerFirst = TRUE
    RunIds = TRUE
    SettleWithdraw = TRUE
    RereadKeepsLabel = TRUE
    DeclaredInterval = TRUE
    Ceiling = FALSE
INVARIANT NoTwoWorkers
