\* The change as specified for workers that may go two poll intervals between
\* checkpoints, where a process stands down after one missed heartbeat. One item
\* and three missed heartbeats. Safety.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 2
    NItems = 1
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 1
    CheckpointGap = 2
    MaxCrashes = 0
    MaxLosses = 0
    MaxStops = 0
    MaxMisses = 3
    MaxHandovers = 0
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
INVARIANT LiveRankNeverGone
INVARIANT MarkNeverPassesUntaken
INVARIANT HandOverStands
