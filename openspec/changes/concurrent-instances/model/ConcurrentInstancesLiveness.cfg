\* The change as specified, with one item, a crash and a stop, so that TLC can
\* also check the liveness properties in minutes.
SPECIFICATION Spec
CONSTANTS
    NRanks = 2
    NItems = 1
    Roster = {1, 2}
    Bound = 3
    MaxCrashes = 1
    MaxLosses = 0
    MaxStops = 1
    MaxMisses = 0
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
INVARIANT LiveRankNeverGone
INVARIANT MarkNeverPassesUntaken
PROPERTY OrphanRecovered
PROPERTY EveryItemHandled
PROPERTY StopNeverLost
