\* As ConcurrentInstancesPollSkewLoss.cfg, with rank 1 the one that may
\* miss heartbeats. The two split a configuration in which either rank may
\* miss, too large for a CI job.
\* Safety.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 2
    NRuns = 0
    NItems = 1
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 0
    MaxLosses = 1
    MaxStops = 0
    MaxMisses = 3
    MaxHandovers = 0
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 0
    MaxPollChanges = 1
    StartLen = 2     \* every process starts on the doubled poll interval
    CeilLen = 2      \* maximum poll interval, in shorter intervals: the longest used here
    MissOnly = 1     \* only rank 1 may miss heartbeats
    CrashOnly = 0    \* any rank may crash
    MaxEdits = 0
    MaxFails = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
    TimerHalts = TRUE
    HolderReleases = TRUE
    HolderStops = TRUE
    VerifyClaims = TRUE
    OwnerFirst = TRUE
    RunIds = TRUE
    SettleWithdraw = TRUE
    RereadKeepsLabel = TRUE
    DeclaredInterval = TRUE
    Ceiling = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
INVARIANT LiveRankNeverGone
INVARIANT MarkNeverPassesUntaken
INVARIANT HandOverStands
INVARIANT NoReceiptWhileWorked
INVARIANT LabelWhileWorked
