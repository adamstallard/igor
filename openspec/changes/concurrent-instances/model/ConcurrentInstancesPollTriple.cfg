\* PollSkew's scenario with the poll interval tripled, as the 30-minute maximum
\* is three times the 10-minute default. The lore head triples the interval;
\* one rank applies the change and the other has not yet. Three heartbeats
\* may be missed: enough for a rank to triple its interval and then miss
\* every heartbeat until its sibling counts it gone, so none of them
\* declares the tripled interval. Safety.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 2
    NRuns = 0
    NItems = 1
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 0
    MaxLosses = 0
    MaxStops = 0
    MaxMisses = 3
    MaxHandovers = 0
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 0
    MaxPollChanges = 1
    StartLen = 1     \* poll interval every process starts on, in shorter intervals
    LongLen = 3      \* the longer poll interval, in shorter intervals: three times the shorter, 30 minutes over 10
    CeilLen = 3      \* maximum poll interval, in shorter intervals: the longest used here
    MissOnly = 0     \* any rank may miss heartbeats
    CrashOnly = 0    \* any rank may crash
    MaxEdits = 0
    MaxFails = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
    HaltOnShortest = TRUE
    TimerHalts = TRUE
    HolderReleases = TRUE
    HolderStops = TRUE
    VerifyClaims = TRUE
    OwnerFirst = TRUE
    RunIds = TRUE
    SettleWithdraw = TRUE
    RereadKeepsLabel = TRUE
    DeclaredInterval = TRUE
    Ceiling = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
INVARIANT LiveRankNeverGone
INVARIANT MarkNeverPassesUntaken
INVARIANT HandOverStands
INVARIANT NoReceiptWhileWorked
INVARIANT LabelWhileWorked
