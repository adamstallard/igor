\* Every poll-interval fault at once: the lore head doubles the interval
\* and changes it back, two crashes may happen in all, across both
\* ranks, the state branch may be lost or rolled back once, and any rank
\* may miss three heartbeats.
\* Safety. Too large for a CI job: run locally, and its result is recorded
\* in design.md. CI runs the split configurations instead.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 2
    NRuns = 0
    NItems = 1
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 2
    MaxLosses = 1
    MaxStops = 0
    MaxMisses = 3
    MaxHandovers = 0
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 0
    MaxPollChanges = 2
    StartLen = 1     \* poll interval every process starts on, in shorter intervals
    CeilLen = 2      \* maximum poll interval, in shorter intervals: the longest used here
    MissOnly = 0     \* any rank may miss heartbeats
    CrashOnly = 0    \* any rank may crash
    MaxEdits = 0
    MaxFails = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
    TimerHalts = TRUE
    HolderReleases = TRUE
    HolderStops = TRUE
    VerifyClaims = TRUE
    OwnerFirst = TRUE
    RunIds = TRUE
    SettleWithdraw = TRUE
    RereadKeepsLabel = TRUE
    DeclaredInterval = TRUE
    Ceiling = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
INVARIANT LiveRankNeverGone
INVARIANT MarkNeverPassesUntaken
INVARIANT HandOverStands
INVARIANT NoReceiptWhileWorked
INVARIANT LabelWhileWorked
