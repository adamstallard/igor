\* The change as specified, with one item, a hand-over, a stop and a rank
\* removed from the roster, so that TLC can check the liveness properties when a
\* rank retires.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 2
    NItems = 1
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 0
    MaxLosses = 0
    MaxStops = 1
    MaxMisses = 0
    MaxHandovers = 1
    MaxRetires = 1
    MaxClockSteps = 0
    MaxPRs = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
INVARIANT LiveRankNeverGone
INVARIANT MarkNeverPassesUntaken
INVARIANT HandOverStands
PROPERTY OrphanRecovered
PROPERTY EveryItemHandled
PROPERTY StopNeverLost
