\* The change as written. Where the change leaves a choice open, an
\* implementation may take either value, so each such choice takes the weaker
\* one: the value nothing in the change rules out. BranchRollback = TRUE
\* likewise lets a reset do anything the change's "lost or reset" allows. TLC
\* finds a violation here: see "What the model proves" in ../design.md.
SPECIFICATION Spec
CONSTANTS
    NRanks = 2
    NItems = 2
    Roster = {1, 2}
    Bound = 3
    MaxCrashes = 1
    MaxLosses = 1
    MaxStops = 0
    VerdictAtRead = FALSE
    FreshView = FALSE
    HeartbeatFirst = FALSE
    MarkAtTriage = TRUE
    LoserRemovesLabel = TRUE
    AdoptReleases = FALSE
    SettleWithinPoll = FALSE
    LabelSweep = FALSE
    BranchRollback = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
INVARIANT LiveRankNeverGone
INVARIANT MarkNeverPassesUntaken
