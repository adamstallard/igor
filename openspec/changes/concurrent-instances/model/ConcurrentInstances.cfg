\* The change as specified: every rule constant TRUE. Safety, with a crash, a
\* lost or rolled-back state branch, and a hand-over. No `igor run` starts
\* here; ConcurrentInstancesRunRankZero.cfg runs one. No claim message is
\* edited either; model/findings/ holds the edit.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 2
    NRuns = 0
    NItems = 2
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 1
    MaxLosses = 1
    MaxStops = 0
    MaxMisses = 0
    MaxHandovers = 1
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 0
    MaxPollChanges = 0
    StartLen = 1     \* poll interval every process starts on, in shorter intervals
    CeilLen = 1      \* maximum poll interval, in shorter intervals: the longest used here
    MissOnly = 0     \* any rank may miss heartbeats
    CrashOnly = 0    \* any rank may crash
    MaxEdits = 0       \* model/findings/EditedMessage.cfg edits a message
    MaxFails = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
    TimerHalts = TRUE
    HolderReleases = TRUE
    HolderStops = TRUE
    VerifyClaims = TRUE
    OwnerFirst = TRUE
    RunIds = TRUE
    SettleWithdraw = TRUE
    RereadKeepsLabel = TRUE
    DeclaredInterval = TRUE
    Ceiling = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
INVARIANT LiveRankNeverGone
INVARIANT MarkNeverPassesUntaken
INVARIANT HandOverStands
INVARIANT NoReceiptWhileWorked
INVARIANT LabelWhileWorked
