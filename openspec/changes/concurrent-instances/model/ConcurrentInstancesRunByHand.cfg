\* `igor run` beside rank 1, with no rank 2 (NRanks = 1). The run starts
\* where rank 1's heartbeat file did not change across its wait: rank 1
\* crashed, or missed a heartbeat. Two misses let rank 1 stand down as well.
\* Rank 1 can then come back while the run goes on, restarted after its
\* crash or resuming once a heartbeat lands, and Fence stops one of the two.
\* NoTwoWorkers is not checked here: findings/RunBesideWorker.cfg and findings/RestartBesideRun.cfg show
\* the two ways the two processes can each work one item before one of
\* them stops.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 1
    NItems = 2
    Roster = {1}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 1
    MaxLosses = 1
    MaxStops = 0
    MaxMisses = 2
    MaxHandovers = 1
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 0
    MaxRuns = 1
    MaxEdits = 0
    MaxFails = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
    TimerHalts = TRUE
    HolderReleases = TRUE
    HolderStops = TRUE
    Fence = TRUE
INVARIANT TypeOK
INVARIANT LiveRankNeverGone
INVARIANT MarkNeverPassesUntaken
INVARIANT HandOverStands
INVARIANT NoReceiptWhileWorked
INVARIANT OneProcessPerRank
