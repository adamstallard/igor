\* The change as specified. The lore head doubles the poll interval; rank 1
\* may crash once and restart, the state branch may be lost or rolled back
\* once, and rank 2 may miss one heartbeat. A watcher that restarts or
\* detects the loss holds no declaration and counts in the maximum poll
\* interval. Safety. One miss keeps it within a CI job;
\* ConcurrentInstancesPollSkewFull.cfg, run locally, allows three.
\* ConcurrentInstancesPollSkewCrashLoss1.cfg swaps the ranks.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 2
    NRuns = 0
    NItems = 1
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 1
    MaxLosses = 1
    MaxStops = 0
    MaxMisses = 1
    MaxHandovers = 0
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 0
    MaxPollChanges = 1
    StartLen = 1     \* poll interval every process starts on, in shorter intervals
    CeilLen = 2      \* maximum poll interval, in shorter intervals: the longest used here
    MissOnly = 2     \* only rank 2 may miss heartbeats
    CrashOnly = 1    \* only rank 1 may crash
    MaxEdits = 0
    MaxFails = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
    TimerHalts = TRUE
    HolderReleases = TRUE
    HolderStops = TRUE
    VerifyClaims = TRUE
    OwnerFirst = TRUE
    RunIds = TRUE
    SettleWithdraw = TRUE
    RereadKeepsLabel = TRUE
    DeclaredInterval = TRUE
    Ceiling = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
INVARIANT LiveRankNeverGone
INVARIANT MarkNeverPassesUntaken
INVARIANT HandOverStands
INVARIANT NoReceiptWhileWorked
INVARIANT LabelWhileWorked
