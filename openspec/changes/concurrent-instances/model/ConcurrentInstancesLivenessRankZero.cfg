\* Liveness with `igor run`, at rank 0, beside rank 1 (NRanks = 1), with a
\* crash and a stop. A run that crashes holding a claim leaves it to rank
\* 1, which takes it over once rank 0 is gone: OrphanRecovered checks that.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 1
    NRuns = 1
    NItems = 1
    Roster = {1}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 1
    MaxLosses = 0
    MaxStops = 1
    MaxMisses = 0
    MaxHandovers = 0
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 0
    MaxEdits = 0
    MaxFails = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
    TimerHalts = TRUE
    HolderReleases = TRUE
    HolderStops = TRUE
    VerifyClaims = TRUE
    OwnerFirst = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
INVARIANT LiveRankNeverGone
INVARIANT MarkNeverPassesUntaken
INVARIANT HandOverStands
INVARIANT NoReceiptWhileWorked
PROPERTY OrphanRecovered
PROPERTY EveryItemHandled
PROPERTY StopNeverLost
