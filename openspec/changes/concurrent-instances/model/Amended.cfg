\* The change with the seven candidate amendments of findings 1 to 7 under
\* "What TLC found" in ../design.md: FreshView, HeartbeatFirst, AdoptReleases,
\* SettleWithinPoll and LabelSweep TRUE, MarkAtTriage and LoserRemovesLabel
\* FALSE. VerdictAtRead has no effect while FreshView is TRUE.
\* BranchRollback = FALSE is an assumption, not an amendment: a reset deletes
\* the heartbeat files (finding 8). Safety only, with a crash and a lost state
\* branch.
SPECIFICATION Spec
CONSTANTS
    NRanks = 2
    NItems = 2
    Roster = {1, 2}
    Bound = 3
    MaxCrashes = 1
    MaxLosses = 1
    MaxStops = 0
    VerdictAtRead = TRUE
    FreshView = TRUE
    HeartbeatFirst = TRUE
    MarkAtTriage = FALSE
    LoserRemovesLabel = FALSE
    AdoptReleases = TRUE
    SettleWithinPoll = TRUE
    LabelSweep = TRUE
    BranchRollback = FALSE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
INVARIANT LiveRankNeverGone
INVARIANT MarkNeverPassesUntaken
