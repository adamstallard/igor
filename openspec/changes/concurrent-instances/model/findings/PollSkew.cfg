\* A finding for Adam, not a rule turned off: CI does not run this file.
\* The lore head doubles the poll interval, and one rank applies it at its
\* cycle start while the other has not. The rank on the longer interval
\* stands down only after four of the shorter intervals without a heartbeat;
\* the other counts it gone after three, and takes the item over while it
\* still works it. TLC finds NoTwoWorkers violated. With DeclaredInterval
\* TRUE, the rule the proposal recommends, TLC finds no violation here.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 2
    NRuns = 0
    NItems = 1
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 0
    MaxLosses = 0
    MaxStops = 0
    MaxMisses = 3
    MaxHandovers = 0
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 0
    MaxPollChanges = 1
    MaxEdits = 0
    MaxFails = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
    TimerHalts = TRUE
    HolderReleases = TRUE
    HolderStops = TRUE
    VerifyClaims = TRUE
    OwnerFirst = TRUE
    RunIds = TRUE
