\* A finding for Adam, not a rule turned off: CI does not run this file.
\* Rank 1 crashes, `igor run` starts as rank 1, and systemd then restarts
\* rank 1. The restarted rank 1 takes the run's id in its heartbeat file for its
\* predecessor's, since a process counts the id its file held at its start
\* as its predecessor's, and the run's claim for its predecessor's, while the
\* run's worker goes on until the run's next heartbeat write or read. TLC
\* finds NoTwoWorkers violated.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 2
    NItems = 1
    Roster = {1, 2}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 1
    MaxLosses = 0
    MaxStops = 0
    MaxMisses = 0
    MaxHandovers = 0
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 0
    MaxRuns = 1
    MaxEdits = 0
    MaxFails = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
    TimerHalts = TRUE
    HolderReleases = TRUE
    HolderStops = TRUE
    Fence = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
