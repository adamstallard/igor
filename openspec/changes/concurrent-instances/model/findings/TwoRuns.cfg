\* A finding for Adam, not a rule turned off: CI does not run this file.
\* Two people run `igor run` for one role at once, so two processes run at
\* rank 0. One sets the label on an item, the other finds it labelled with
\* no claim message yet and posts one, and each then reads the earliest
\* claim message as its own rank's. TLC finds NoTwoWorkers violated.
SPECIFICATION Spec
VIEW StateView
CONSTANTS
    NRanks = 1
    NRuns = 2
    NItems = 1
    Roster = {1}
    Bound = 3
    StandDownAt = 2
    CheckpointGap = 1
    MaxCrashes = 0
    MaxLosses = 0
    MaxStops = 0
    MaxMisses = 0
    MaxHandovers = 0
    MaxRetires = 0
    MaxClockSteps = 0
    MaxPRs = 0
    MaxEdits = 0
    MaxFails = 0
    CounterLiveness = TRUE
    WatchAdvance = TRUE
    ReReadHeartbeats = TRUE
    HeartbeatFirst = TRUE
    ReleaseOnTakeover = TRUE
    VerifyWithinPoll = TRUE
    LoserKeepsLabel = TRUE
    MarkAfterAttempts = TRUE
    LabelSweep = TRUE
    StandDownOnMisses = TRUE
    HandoverContest = TRUE
    HandoverRecorded = TRUE
    RosterWaits = TRUE
    CatchUpAny = TRUE
    CatchUpSupersedes = TRUE
    TimerHalts = TRUE
    HolderReleases = TRUE
    HolderStops = TRUE
    VerifyClaims = TRUE
    OwnerFirst = TRUE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
