\* As Amended.cfg, with a stop in place of the lost branch and one item, so
\* that TLC can also check the liveness properties in a few minutes.
SPECIFICATION Spec
CONSTANTS
    NRanks = 2
    NItems = 1
    Roster = {1, 2}
    Bound = 3
    MaxCrashes = 1
    MaxLosses = 0
    MaxStops = 1
    VerdictAtRead = TRUE
    FreshView = TRUE
    HeartbeatFirst = TRUE
    MarkAtTriage = FALSE
    LoserRemovesLabel = FALSE
    AdoptReleases = TRUE
    SettleWithinPoll = TRUE
    LabelSweep = TRUE
    BranchRollback = FALSE
INVARIANT TypeOK
INVARIANT NoTwoWorkers
INVARIANT LiveRankNeverGone
INVARIANT MarkNeverPassesUntaken
PROPERTY OrphanRecovered
PROPERTY EveryItemHandled
PROPERTY StopNeverLost
