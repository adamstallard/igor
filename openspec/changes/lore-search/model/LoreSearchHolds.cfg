\* The change as specified: every rule constant TRUE, and the assumption
\* DeletedSurvivesCrash FALSE (see LoreSearchHolds.tla). Two ranks,
\* long-running processes of one role, on their own state directories, and an
\* `igor run` sharing r1's, all three keeping holds of the item at once. Once
\* one hold has its `needs a person` row and a release is requested, another
\* keep may still be part-way (decision 125). With a crash and a retired rank,
\* or an `igor run` killed part-way, whose keep CleanOrphans cleans up.
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Layout = "own"
    Keepers = {"r1", "r2", "run"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 1
    MaxCopies = 0
    CopyBeforeFiles = TRUE
    EntryFirst = TRUE
    ClearAfterNeeds = TRUE
    ClearByDeleting = TRUE
    RebuildFromLedger = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    CleanOrphans = TRUE    \* exercised: a rank may retire, and the `igor run` be killed, part-way through keeping
    DetectMismatch = TRUE    \* not checked here: no property reads the notice
    OperatorActs = TRUE
    DeletedSurvivesCrash = FALSE
INVARIANTS
    TypeOK
    NeverReleasedWithFiles
    DeletesOnOwnDirOnly
    HeldUntilReleased
    ClearedOnlyByDeleting
CHECK_DEADLOCK FALSE
