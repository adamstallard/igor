\* The change as specified: every rule constant TRUE, and the assumption
\* KeepsDoneFirst, which findings/KeepDuringRelease.cfg drops. Two ranks, long-running
\* processes of one role, on their own
\* state directories and an `igor run` sharing r1's, all three keeping the
\* question (a race), with a crash and a retired rank. A lost hold record is in
\* LoreSearchHoldsLostRecord.cfg; a loss with keeps racing is a finding, in
\* findings/LostRecordRebuilt.cfg.
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Dirs = {"d1", "d2"}
    Layout = "own"
    Keepers = {"r1", "r2", "run"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 1
    EntryFirst = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    NoticeUntilUnaffected = TRUE
    KeepsDoneFirst = TRUE
INVARIANTS
    TypeOK
    NeverReleasedWithFiles
    DeletesOnOwnDirOnly
    HeldUntilReleased
    HoldSurvivesLostRecord
PROPERTIES
    NoticeHeldWhileStuck
CHECK_DEADLOCK FALSE
