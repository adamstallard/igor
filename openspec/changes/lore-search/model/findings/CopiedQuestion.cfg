\* Finding, for Adam: CopyBeforeFiles FALSE. A copy of "d1" taken after a
\* question file is written holds that named file too; the rank on the copy
\* deletes it, clears the entry and releases while the original still holds
\* its files. TLC reports ClearedOnlyByDeleting, since the entry is cleared on
\* the copy; the hold's `released` row then follows while the original's files
\* remain, against NeverReleasedWithFiles. Adam is the repository's owner.
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "rc"}
    Runs = {}
    Layout = "own"
    Keepers = {"r1", "r2"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 0
    MaxCopies = 1
    CopyBeforeFiles = FALSE
    EntryFirst = TRUE
    ClearAfterNeeds = TRUE
    ClearByDeleting = TRUE
    RebuildFromLedger = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    OperatorActs = TRUE
    DeletedSurvivesCrash = FALSE
INVARIANTS
    TypeOK
    NeverReleasedWithFiles
    DeletesOnOwnDirOnly
    HeldUntilReleased
    ClearedOnlyByDeleting
CHECK_DEADLOCK FALSE
