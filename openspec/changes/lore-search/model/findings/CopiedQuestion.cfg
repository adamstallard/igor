\* Accepted limit (decision 133: copying a live state directory is unsupported,
\* and the operator recovers with the stuck-release notice and `igor release`).
\* CopyBeforeFiles FALSE. A copy of "d1" taken after a
\* question file is written holds that named file too; the rank on the copy
\* deletes it, clears the entry and releases while the original still holds
\* its files. TLC stops at the first broken invariant,
\* ClearedOnlyByDeleting, since the entry is cleared on the copy; the hold's
\* `released` row would then follow while the original's files remain,
\* breaking NeverReleasedWithFiles too.
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "rc"}
    Runs = {}
    Layout = "own"
    Keepers = {"r1", "r2"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 0
    MaxCopies = 1
    CopyBeforeFiles = FALSE
    EntryFirst = TRUE
    ClearAfterNeeds = TRUE
    ClearByDeleting = TRUE
    RebuildFromLedger = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    CleanOrphans = TRUE
    OperatorActs = TRUE
    DeletedSurvivesCrash = FALSE
INVARIANTS
    TypeOK
    NeverReleasedWithFiles
    DeletesOnOwnDirOnly
    HeldUntilReleased
    ClearedOnlyByDeleting
CHECK_DEADLOCK FALSE
