\* Finding, for Adam: KeepsDoneFirst FALSE. A racing keep has added its entry
\* but not yet written its files when a process on its directory, or the
\* operator, finds the directory empty, clears the entry and releases; the
\* keep then writes its files after `released` (NeverReleasedWithFiles).
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Dirs = {"d1", "d2"}
    Layout = "own"
    Keepers = {"r1", "r2", "run"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 0
    EntryFirst = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    NoticeUntilUnaffected = TRUE
    KeepsDoneFirst = FALSE
INVARIANTS
    TypeOK
    NeverReleasedWithFiles
    DeletesOnOwnDirOnly
    HeldUntilReleased
    HoldSurvivesLostRecord
PROPERTIES
    NoticeHeldWhileStuck
CHECK_DEADLOCK FALSE
