\* Finding, for Adam: DeletedSurvivesCrash FALSE. A process crashes after
\* deleting a hold's named file and before clearing its entry; the file is now
\* absent, so no process can clear the entry. Only the operator's flag could
\* release the hold, and with no operator here ReleaseCompletes fails.
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Layout = "shared"
    Keepers = {"r1", "r2"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 1
    MaxCopies = 0
    CopyBeforeFiles = TRUE
    EntryFirst = TRUE
    ClearAfterNeeds = TRUE
    ClearByDeleting = TRUE
    RebuildFromLedger = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    OperatorActs = FALSE
    DeletedSurvivesCrash = FALSE
PROPERTIES
    ReleaseCompletes
CHECK_DEADLOCK FALSE
