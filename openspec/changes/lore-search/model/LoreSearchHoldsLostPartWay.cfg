\* The hold record lost once while both ranks, sharing "d1", keep holds, and one
\* rank may retire part-way through its keep. A lost record drops the retired
\* rank's entry, and a rebuilt one may reopen an entry cleared before the
\* loss whose `released` row was not yet appended; this
\* configuration checks the invariants and that each such mismatch opens the
\* mismatch notice (decisions 140 and 141).
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Layout = "shared"
    Keepers = {"r1", "r2"}
    MaxCrashes = 0
    MaxLosses = 1
    MaxRetires = 1
    MaxCopies = 0
    CopyBeforeFiles = TRUE
    EntryFirst = TRUE
    ClearAfterNeeds = TRUE
    ClearByDeleting = TRUE
    RebuildFromLedger = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    CleanOrphans = TRUE    \* exercised: a rank may retire part-way
    DetectMismatch = TRUE    \* checked by MismatchNoticed
    OperatorActs = TRUE
    DeletedSurvivesCrash = FALSE
INVARIANTS
    TypeOK
    NeverReleasedWithFiles
    DeletesOnOwnDirOnly
    HeldUntilReleased
    ClearedOnlyByDeleting
PROPERTIES
    MismatchNoticed
CHECK_DEADLOCK FALSE
