\* The change as specified, with "d1" copied to "d1copy", whose rank rc has the
\* same state-directory id, before any question file is written in "d1": rc finds
\* no named file, so it cannot clear the entry (decision 132). The open entry
\* naming d1's id, while "d1copy" has no question file, is a mismatch on the
\* copy, and MismatchNoticed checks that rc opens the notice (decision 140).
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "rc"}
    Runs = {}
    Layout = "own"
    Keepers = {"r1", "r2"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 0
    MaxCopies = 1
    CopyBeforeFiles = TRUE
    EntryFirst = TRUE
    ClearAfterNeeds = TRUE
    ClearByDeleting = TRUE
    RebuildFromLedger = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    CleanOrphans = TRUE
    DetectMismatch = TRUE    \* checked by MismatchNoticed
    OperatorActs = TRUE
    DeletedSurvivesCrash = FALSE
INVARIANTS
    TypeOK
    NeverReleasedWithFiles
    DeletesOnOwnDirOnly
    HeldUntilReleased
    ClearedOnlyByDeleting
PROPERTIES
    MismatchNoticed
CHECK_DEADLOCK FALSE
