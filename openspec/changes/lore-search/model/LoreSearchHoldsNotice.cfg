\* Liveness of the notice: an `igor run` on its own directory keeps the
\* question and exits, so its entry is stuck, and a live rank opens the
\* notice, any live rank doing so, and it stays open while the release is stuck
\* (decision 122).
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Dirs = {"d1", "d2"}
    Layout = "shared"
    Keepers = {"r1", "run"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 0
    EntryFirst = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    NoticeUntilUnaffected = TRUE
    KeepsDoneFirst = TRUE
PROPERTIES
    StuckIsNoticed
    NoticeHeldWhileStuck
CHECK_DEADLOCK FALSE
