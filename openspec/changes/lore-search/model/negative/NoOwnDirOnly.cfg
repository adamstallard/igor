\* OwnDirOnly FALSE: a live process takes over the release of a gone one on
\* another directory, deleting there.
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Dirs = {"d1", "d2"}
    Layout = "own"
    Keepers = {"r1", "r2", "run"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 1
    EntryFirst = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = FALSE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    NoticeUntilUnaffected = TRUE
    KeepsDoneFirst = TRUE
INVARIANTS
    TypeOK
    NeverReleasedWithFiles
    DeletesOnOwnDirOnly
    HeldUntilReleased
    HoldSurvivesLostRecord
PROPERTIES
    NoticeHeldWhileStuck
CHECK_DEADLOCK FALSE
