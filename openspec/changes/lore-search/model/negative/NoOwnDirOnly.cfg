\* OwnDirOnly FALSE: a live process takes over the release of a hold whose
\* rank, r2, has retired, deleting on r2's directory.
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Layout = "own"
    Keepers = {"r1", "r2", "run"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 1
    MaxCopies = 0
    CopyBeforeFiles = TRUE
    EntryFirst = TRUE
    ClearAfterNeeds = TRUE
    ClearByDeleting = TRUE
    RebuildFromLedger = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = FALSE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    CleanOrphans = TRUE
    DetectMismatch = TRUE    \* not checked here: no property reads the notice
    OperatorActs = TRUE
    DeletedSurvivesCrash = FALSE
INVARIANTS
    TypeOK
    NeverReleasedWithFiles
    DeletesOnOwnDirOnly
    HeldUntilReleased
    ClearedOnlyByDeleting
CHECK_DEADLOCK FALSE
