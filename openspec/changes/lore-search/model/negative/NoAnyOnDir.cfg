\* AnyOnDir FALSE: only the process an entry names clears it, so when it
\* retires its directory-mate cannot finish the release.
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Dirs = {"d1", "d2"}
    Layout = "shared"
    Keepers = {"r1", "r2"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 1
    EntryFirst = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = FALSE
    WorkOnlyIfReleased = TRUE
    NoticeUntilUnaffected = TRUE
    KeepsDoneFirst = TRUE
PROPERTIES
    ReleaseCompletes
CHECK_DEADLOCK FALSE
