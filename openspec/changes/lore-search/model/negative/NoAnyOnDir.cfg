\* AnyOnDir FALSE: only the rank that kept a hold acts for it, so when that
\* rank retires, the other rank on its directory cannot finish the release.
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Layout = "shared"
    Keepers = {"r1", "r2"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 1
    MaxCopies = 0
    CopyBeforeFiles = TRUE
    EntryFirst = TRUE
    ClearAfterNeeds = TRUE
    ClearByDeleting = TRUE
    RebuildFromLedger = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = FALSE
    WorkOnlyIfReleased = TRUE
    CleanOrphans = TRUE    \* exercised, but not what fails here
    DetectMismatch = TRUE    \* not checked here: no property reads the notice
    OperatorActs = FALSE
    DeletedSurvivesCrash = TRUE
PROPERTIES
    ReleaseCompletes
CHECK_DEADLOCK FALSE
