\* RebuildFromLedger FALSE: a lost record rebuilt only from the entries keeps
\* wrote after the loss has no entry for a hold kept before it, so nothing ever
\* clears that hold's entry and the hold is never released (decision 126).
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Layout = "shared"
    Keepers = {"r1", "r2"}
    MaxCrashes = 0
    MaxLosses = 1
    MaxRetires = 0
    MaxCopies = 0
    CopyBeforeFiles = TRUE
    EntryFirst = TRUE
    ClearAfterNeeds = TRUE
    ClearByDeleting = TRUE
    RebuildFromLedger = FALSE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    CleanOrphans = TRUE    \* not exercised: no rank retires
    OperatorActs = FALSE
    DeletedSurvivesCrash = TRUE
PROPERTIES
    ReleaseCompletes
CHECK_DEADLOCK FALSE
