\* RebuildFromLedger FALSE: a lost record rebuilt from later entries alone has
\* no entry for an earlier hold, so nothing ever clears it and the hold is never
\* released (decision 126).
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Layout = "shared"
    Keepers = {"r1", "r2"}
    MaxCrashes = 0
    MaxLosses = 1
    MaxRetires = 0
    MaxCopies = 0
    CopyBeforeFiles = TRUE
    EntryFirst = TRUE
    ClearAfterNeeds = TRUE
    ClearByDeleting = TRUE
    RebuildFromLedger = FALSE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    OperatorActs = FALSE
    DeletedSurvivesCrash = TRUE
PROPERTIES
    ReleaseCompletes
CHECK_DEADLOCK FALSE
