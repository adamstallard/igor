\* RecoverReleased FALSE: a crash between the last clear and `released`
\* leaves every entry cleared and no `released` row, for good.
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Dirs = {"d1", "d2"}
    Layout = "shared"
    Keepers = {"r1", "r2"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 1
    EntryFirst = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = FALSE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    NoticeUntilUnaffected = TRUE
    KeepsDoneFirst = TRUE
PROPERTIES
    ReleaseCompletes
CHECK_DEADLOCK FALSE
