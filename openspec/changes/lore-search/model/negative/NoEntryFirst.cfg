\* EntryFirst FALSE: a keep writes its files before adding its entry, so a
\* release can complete while a racing keep's files have no entry.
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Dirs = {"d1", "d2"}
    Layout = "own"
    Keepers = {"r1", "r2", "run"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 1
    EntryFirst = FALSE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    NoticeUntilUnaffected = TRUE
    KeepsDoneFirst = TRUE
INVARIANTS
    TypeOK
    NeverReleasedWithFiles
    DeletesOnOwnDirOnly
    HeldUntilReleased
    HoldSurvivesLostRecord
PROPERTIES
    NoticeHeldWhileStuck
CHECK_DEADLOCK FALSE
