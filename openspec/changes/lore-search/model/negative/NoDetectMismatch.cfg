\* DetectMismatch FALSE: after the rank on a copy of "d1", taken after a
\* question file is written, releases a hold, nothing notices the files d1
\* still holds (decision 140). As in LoreSearchHoldsCopyAfterWrite.cfg, the
\* two invariants such a copy breaks are left out.
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "rc"}
    Runs = {}
    Layout = "own"
    Keepers = {"r1", "r2"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 0
    MaxCopies = 1
    CopyBeforeFiles = FALSE
    EntryFirst = TRUE
    ClearAfterNeeds = TRUE
    ClearByDeleting = TRUE
    RebuildFromLedger = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    CleanOrphans = TRUE
    DetectMismatch = FALSE
    OperatorActs = TRUE
    DeletedSurvivesCrash = FALSE
INVARIANTS
    TypeOK
    DeletesOnOwnDirOnly
    HeldUntilReleased
PROPERTIES
    MismatchNoticed
CHECK_DEADLOCK FALSE
