\* The change as specified, with r1 and r2 keeping at once, interleaved with the hold record being lost once:
\* any process rebuilds it from the `needs a person` rows (decision 126).
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Layout = "own"
    Keepers = {"r1", "r2"}
    MaxCrashes = 1
    MaxLosses = 1
    MaxRetires = 0
    MaxCopies = 0
    CopyBeforeFiles = TRUE
    EntryFirst = TRUE
    ClearAfterNeeds = TRUE
    ClearByDeleting = TRUE
    RebuildFromLedger = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    CleanOrphans = TRUE    \* not exercised: no rank retires and the `igor run` keeps nothing
    OperatorActs = TRUE
    DeletedSurvivesCrash = FALSE
INVARIANTS
    TypeOK
    NeverReleasedWithFiles
    DeletesOnOwnDirOnly
    HeldUntilReleased
    ClearedOnlyByDeleting
CHECK_DEADLOCK FALSE
