\* The change as specified, with a lost hold record and one keeping process,
\* so no second keep re-creates the record after r1's: the hold survives the
\* loss (decision 83).
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Dirs = {"d1", "d2"}
    Layout = "own"
    Keepers = {"r1"}
    MaxCrashes = 1
    MaxLosses = 1
    MaxRetires = 1
    EntryFirst = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    NoticeUntilUnaffected = TRUE
    KeepsDoneFirst = TRUE
INVARIANTS
    TypeOK
    NeverReleasedWithFiles
    DeletesOnOwnDirOnly
    HeldUntilReleased
    HoldSurvivesLostRecord
PROPERTIES
    NoticeHeldWhileStuck
CHECK_DEADLOCK FALSE
