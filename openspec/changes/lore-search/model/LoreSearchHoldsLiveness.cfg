\* Liveness: a requested release reaches `released` for every hold while each
\* open hold's home directory has a live process. Both ranks share a directory,
\* one may retire, the `igor run` keeps nothing, and a crash keeps what the
\* process deleted (DeletedSurvivesCrash; findings/CrashBeforeClear.cfg drops it).
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Layout = "shared"
    Keepers = {"r1", "r2"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 1
    MaxCopies = 0
    CopyBeforeFiles = TRUE
    EntryFirst = TRUE
    ClearAfterNeeds = TRUE
    ClearByDeleting = TRUE
    RebuildFromLedger = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    OperatorActs = FALSE
    DeletedSurvivesCrash = TRUE
PROPERTIES
    ReleaseCompletes
CHECK_DEADLOCK FALSE
