\* Liveness: a requested release reaches `released` while each open entry's
\* directory has a live process. Both ranks share a directory, one may retire,
\* and the `igor run` keeps nothing, so a live process stays on that directory.
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Dirs = {"d1", "d2"}
    Layout = "shared"
    Keepers = {"r1", "r2"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 1
    EntryFirst = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    NoticeUntilUnaffected = TRUE
    KeepsDoneFirst = TRUE
PROPERTIES
    ReleaseCompletes
CHECK_DEADLOCK FALSE
