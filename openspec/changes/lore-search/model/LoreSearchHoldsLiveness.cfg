\* Checks three liveness properties. ReleaseCompletes: a requested release
\* reaches `released` for every hold, provided each open hold's home directory
\* has a live process at the moment the request covers it. OrphanCleaned: a
\* rank that retired part-way through keeping has its files deleted and its
\* entry cleared (decision 135). MismatchNoticed: any mismatch opens the
\* mismatch notice (decision 140).
\* Both ranks share a directory, one may retire, and the
\* `igor run` keeps nothing.
\* Assumption, not a rule the change states: DeletedSurvivesCrash, that a
\* process still knows after a crash which named files it deleted. Without it,
\* a crash between deleting a named file and clearing its entry leaves the
\* hold to the mismatch notice and to the operator's flag in `igor release`,
\* a limit Adam, the repository's owner, accepts (decision 134);
\* LoreSearchHoldsCrashBeforeClear.cfg checks that the notice opens then.
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Layout = "shared"
    Keepers = {"r1", "r2"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 1
    MaxCopies = 0
    CopyBeforeFiles = TRUE
    EntryFirst = TRUE
    ClearAfterNeeds = TRUE
    ClearByDeleting = TRUE
    RebuildFromLedger = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    CleanOrphans = TRUE
    DetectMismatch = TRUE    \* checked by MismatchNoticed
    OperatorActs = FALSE
    DeletedSurvivesCrash = TRUE
PROPERTIES
    MismatchNoticed
    ReleaseCompletes
    OrphanCleaned
CHECK_DEADLOCK FALSE
