\* A crash between deleting a hold's named file and clearing its entry, with
\* both ranks sharing a directory and no operator. With DeletedSurvivesCrash
\* FALSE, as in the real system, no process can then clear the entry; only
\* the operator's flag could, a limit Adam, the repository's owner, accepts
\* (decision 134). The operator is left out to show the hold then stays. This
\* configuration checks the invariants and that the mismatch, an entry whose
\* named file is absent, opens the mismatch notice (decision 140); it leaves
\* out ReleaseCompletes, which only the operator's flag would complete.
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "run"}
    Runs = {"run"}
    Layout = "shared"
    Keepers = {"r1", "r2"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 1
    MaxCopies = 0
    CopyBeforeFiles = TRUE
    EntryFirst = TRUE
    ClearAfterNeeds = TRUE
    ClearByDeleting = TRUE
    RebuildFromLedger = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    CleanOrphans = TRUE
    DetectMismatch = TRUE    \* checked by MismatchNoticed
    OperatorActs = FALSE
    DeletedSurvivesCrash = FALSE
INVARIANTS
    TypeOK
    NeverReleasedWithFiles
    DeletesOnOwnDirOnly
    HeldUntilReleased
    ClearedOnlyByDeleting
PROPERTIES
    MismatchNoticed
CHECK_DEADLOCK FALSE
