\* A copy of "d1" taken after a question file is written. Copying a live state
\* directory is unsupported rather than prevented (decision 133), so it can
\* happen: the rank on the copy
\* deletes its copy of the named file, clears the entry and releases while d1
\* still holds the files. That breaks ClearedOnlyByDeleting and
\* NeverReleasedWithFiles, which this configuration leaves out; it checks that
\* the mismatch on d1, files no open entry names, opens the mismatch notice
\* (decision 140).
SPECIFICATION Spec
CONSTANTS
    Procs = {"r1", "r2", "rc"}
    Runs = {}
    Layout = "own"
    Keepers = {"r1", "r2"}
    MaxCrashes = 1
    MaxLosses = 0
    MaxRetires = 0
    MaxCopies = 1
    CopyBeforeFiles = FALSE
    EntryFirst = TRUE
    ClearAfterNeeds = TRUE
    ClearByDeleting = TRUE
    RebuildFromLedger = TRUE
    ReReadBeforeReleased = TRUE
    RecoverReleased = TRUE
    OwnDirOnly = TRUE
    AnyOnDir = TRUE
    WorkOnlyIfReleased = TRUE
    CleanOrphans = TRUE
    DetectMismatch = TRUE    \* checked by MismatchNoticed
    OperatorActs = TRUE
    DeletedSurvivesCrash = FALSE
INVARIANTS
    TypeOK
    DeletesOnOwnDirOnly
    HeldUntilReleased
PROPERTIES
    MismatchNoticed
CHECK_DEADLOCK FALSE
