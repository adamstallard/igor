# Copy this to igor.config.yaml in the repository that holds your lore, and COMMIT it
# there. It is shared team configuration — uncommitted, these values drift between
# whoever runs the tool and entries score differently depending on whose machine
# computed them.
#
# It does not belong inside a clone of Igor. Igor is a shared public tool; this file
# describes your team. The tool refuses to start if it finds a config inside itself.

# Where entries are written, relative to this config file. When the config lives in the
# lore repository, as it should, that is simply here.
destination: .

# Any one of these may approve an entry. Also the escalation target when the author an
# entry was mined from does not respond.
reviewers:
  - alice
  - bob

# Authors whose provenance carries extra weight. A correction from the person who owns
# an area should outrank a drive-by.
experts:
  - alice

# Roles live beside this file, one YAML per role under `roles/`, and the filename is the name.
# A role declares extends, seat, sources, lane, instructions, completion, allow, commands,
# budget_share and reviewers. `commands` is what its worker may run — declare none and the
# worker can edit files and nothing else, so it cannot test its own change. See the README.

# Whose Claude subscription pays for the reasoning. Without a seat an Igor can triage but
# cannot work — and a seat naming no token source (token_env, token_file, or token_command)
# reads fine while paying for nothing, because a worker's environment is written out rather
# than inherited and cannot reach a keychain.
#
# A seat belongs to a subscription, not to an Igor: several Igors draw on one through a pool,
# and one Igor may draw on several. Name them for whose capacity they are.
budget:
  seats:
    # Bought for the fleet. No owner, so no reserve — it exists to be spent.
    - id: fleet-1
      dedicated: true
      token_env: IGOR_SEAT_FLEET_1

    # A person's own subscription, lent to the fleet. `reserve` is their floor: at 0.5 an Igor
    # stops at half the window and leaves the rest to them. See docs/seats.md.
    #
    # `capacity` is an optional starting estimate, in dollars of list-price spend a window
    # holds. A reserve is a fraction of capacity, so a reserved seat with no capacity figure at
    # all is passed over rather than guessed at; a declared one gets it started. The first
    # observation of the seat replaces it outright, and until then it is reported as declared.
    # It is one figure for a seat whose session and weekly windows hold very different amounts,
    # so leaving it out and waiting for an observation is the safer course.
    - id: adam
      owner: adam@example.com
      reserve: 0.5
      token_env: IGOR_SEAT_ADAM

  # Order is the allocation mechanism: an Igor takes the first seat with headroom, so listing
  # dedicated capacity first means a person's is only ever reached once it is spent.
  pools:
    - id: engineering
      seats: [fleet-1, adam]
