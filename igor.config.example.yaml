# Configuration for one team's lore. It belongs at the root of the repository holding
# that lore, and COMMITTED there: uncommitted, these values drift between whoever runs
# the tool and entries score differently depending on whose machine computed them.
# `igor init` writes it from this file, with the values only you can choose left blank.
#
# It does not belong inside a clone of Igor. Igor is a shared public tool; this file
# describes your team. The tool refuses to start if it finds a config inside itself.
#
# Every key here is read. A key Igor does not recognise is refused by name rather than
# ignored, at every level of this file and of the role files beside it, so a typo fails
# where you can see it instead of turning something off.

# Where entries are written, relative to this config file. When the config lives in the
# lore repository, as it should, that is simply here.
destination: .

# Any one of these may approve an entry. Also the escalation target when the author an
# entry was mined from does not respond.
reviewers:
  - alice
  - bob

# Authors whose provenance carries extra weight. A correction from the person who owns
# an area should outrank a drive-by.
experts:
  - alice

# Roles live beside this file, one YAML per role under `roles/`, and the filename is the name.
# A role declares extends, seat, sources, lane, instructions, completion, allow, commands,
# budget_share and reviewers. `commands` is what its worker may run — declare none and the
# worker can edit files and nothing else, so it cannot test its own change. See the README.

# Whose Claude subscription pays for the reasoning. Without a seat an Igor can triage but
# cannot work — and a seat naming no token source (token_env, token_file, or token_command)
# reads fine while paying for nothing, because a worker's environment is written out rather
# than inherited and cannot reach a keychain.
#
# A seat belongs to a subscription, not to an Igor: several Igors draw on one through a pool,
# and one Igor may draw on several. Name them for whose capacity they are.
budget:
  seats:
    # Bought for the fleet. No owner, so no reserve — it exists to be spent.
    - id: fleet-1
      dedicated: true
      token_env: IGOR_SEAT_FLEET_1

    # A person's own subscription, lent to the fleet. `reserve` is their floor: at 0.5 an Igor
    # stops at half the window and leaves the rest to them. See docs/seats.md.
    #
    # `capacity_estimate` is an optional starting figure, per window, in dollars of list-price
    # spend that window holds. A reserve is a fraction of capacity, so a reserved seat with no
    # figure at all is passed over rather than guessed at; a declared one gets it started. The
    # first observation of that seat and window replaces it outright, and until then it is
    # reported as declared. Declare only a window you know the size of — a plausible-looking
    # number authorises real spend, and waiting for an observation is the safer course.
    - id: adam
      owner: adamstallard
      reserve: 0.5
      # A different source from fleet-1's, because the choice is per seat and the right one
      # depends on where the token already lives: `token_env` names a variable, `token_file` a
      # path, `token_command` something to run and take stdout — `pass`, `op read`, a keychain.
      # Exactly one per seat. All three name where the token is rather than holding it, which
      # is what keeps this file committable.
      token_command: pass show igor/seat-adam
      # capacity_estimate:
      #   session: <dollars>
      #   week: <dollars>

  # Order is the allocation mechanism: an Igor takes the first seat with headroom, so listing
  # dedicated capacity first means a person's is only ever reached once it is spent.
  pools:
    - id: engineering
      seats: [fleet-1, adam]

# When an Igor is stuck on its own configuration, every item fails the same way: a command its
# role's `commands` refuses, say, or a seat token the provider refuses. Each failure names the
# setting that would cure it, such as `role:web:commands`; a setting that keeps failing this way
# is called a condition. After `threshold` failures in a row naming one setting, the role it
# names takes no new item, or for a seat, no role draws on it. After `cooldown_minutes`, one item
# is let through to test whether the setting is fixed; each time it is not, the wait doubles, up
# to `max_cooldown_minutes`. Fixing the setting is enough: no command clears a stop, and a
# replaced seat token is picked up on the next cycle.
#
# The three values apply to every condition and every Igor at once. Nothing else can be set
# here: no failure can be marked as worse than another. A refused GitHub App credential ignores
# them: it stops its Igor on the first failure, and `igor serve` asks again each cycle and
# resumes work as soon as GitHub accepts the credential. Left out, the values are those below,
# which are provisional: no run history has been fitted to them. Raise `threshold` if one-off
# failures stop roles that work; lower `max_cooldown_minutes` to have an overnight fix noticed
# sooner.
# conditions:
#   threshold: 3
#   cooldown_minutes: 15
#   max_cooldown_minutes: 360
