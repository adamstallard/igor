# Runs TLC on the TLA+ model of the OpenSpec change concurrent-instances, one
# check per configuration file beside the model. ConcurrentInstances.cfg checks
# the change as written, and fails by design while the findings in the
# change's design.md ("What the model proves") are open. Amended.cfg and
# AmendedLiveness.cfg pass, so a failure in either is a regression.
#
# To move to another tla2tools.jar release, change TLA_TOOLS_VERSION and
# TLA_TOOLS_SHA256 together: the checksum step rejects any other file.
name: TLA+ concurrent-instances

on:
  push:
    branches: [main]
    paths:
      - 'openspec/changes/concurrent-instances/**'
      - '.github/workflows/tla-concurrent-instances.yml'
  pull_request:
    paths:
      - 'openspec/changes/concurrent-instances/**'
      - '.github/workflows/tla-concurrent-instances.yml'

permissions:
  contents: read

jobs:
  tlc:
    name: TLC ${{ matrix.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: [ConcurrentInstances.cfg, Amended.cfg, AmendedLiveness.cfg]
    env:
      TLA_TOOLS_VERSION: v1.7.4
      TLA_TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch tla2tools.jar and check its checksum
        run: |
          curl -fsSLo "$RUNNER_TEMP/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/$TLA_TOOLS_VERSION/tla2tools.jar"
          echo "$TLA_TOOLS_SHA256  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
      - name: Run TLC
        working-directory: openspec/changes/concurrent-instances/model
        run: |
          java -XX:+UseParallelGC -cp "$RUNNER_TEMP/tla2tools.jar" tlc2.TLC \
            -workers auto -cleanup -metadir "$RUNNER_TEMP/states" \
            -config "${{ matrix.config }}" ConcurrentInstances.tla
