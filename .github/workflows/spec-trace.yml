name: spec-trace
on: [push, pull_request]
jobs:
  spec-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@2.0.0
      - name: Every scenario in openspec/specs is tagged by a test
        env:
          # The adamstallard/shared-skills commit whose spec_trace.py CI downloads.
          # Keep it a full SHA, never a branch: on a branch, a shared-skills change
          # could fail or pass this repository's CI with no change here.
          # To update this SHA: https://github.com/adamstallard/shared-skills/tree/main/.agents/skills/spec-trace#ci
          SPEC_TRACE_SHA: 5bc0cb785e6fae9bb425b3300b5f6fcb180d9562
        run: |
          curl -fsSL "https://raw.githubusercontent.com/adamstallard/shared-skills/$SPEC_TRACE_SHA/.agents/skills/spec-trace/scripts/spec_trace.py" -o "$RUNNER_TEMP/spec_trace.py"
          python3 "$RUNNER_TEMP/spec_trace.py" check
